# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://michaelpragsdale.com`
#   (Michael P. Ragsdale's technical engineering portfolio and Executive Systems
#   Architect Dossier, built with Angular 19 Zoneless Signals).
#
# Why does it exist in the ecosystem?
#   Within RaggieSoft's workspace architecture, `michaelpragsdale.com` is the
#   SOLE technical recruiter and engineering portfolio domain (separate from
#   consumer entertainment sites on `*.raggiesoft.com`). This file configures
#   Nginx to serve the compiled Angular 19 bundle directly at the apex domain
#   `https://michaelpragsdale.com` with split-tier caching: instant revalidation
#   on `/index.html` paired with 1-year `immutable` caching on content-hashed
#   Angular `.js` and `.css` chunks, plus explicit browser security headers.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for
#     `michaelpragsdale.com` and `www.michaelpragsdale.com`, served from
#     `/var/www/michaelpragsdale.com` (deployed automatically by `sarah-deploy.sh`).
#   - Outputs: Redirects `http://` and `www.` to `https://michaelpragsdale.com`,
#     attaches security headers (`X-Content-Type-Options`, `Referrer-Policy`),
#     caches fingerprinted JS/CSS for 1 year, and returns genuine `404` status
#     codes via `/404.html` for non-existent paths.
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# Upstream CDN / DNS: Cloudflare (Proxied A / AAAA Records)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`michaelpragsdale.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Accept HTTPS connections for both the apex domain and `www.` subdomain.
    server_name michaelpragsdale.com www.michaelpragsdale.com;

    # Folder containing the compiled Angular 19 browser output (`dist/.../browser/`).
    root /var/www/michaelpragsdale.com;

    # Access and error log paths on the Droplet.
    access_log /var/log/nginx/michaelpragsdale_access.log;
    error_log /var/log/nginx/michaelpragsdale_error.log;

    # Serve `index.html` when visiting directory paths such as `/`.
    index index.html;

    # Canonical Apex Redirect (`www.` -> bare apex domain):
    # Redirecting `www.michaelpragsdale.com` to `https://michaelpragsdale.com` via `301`
    # ensures recruiters, resumes, and search engines all share one exact URL format.
    if ($host = www.michaelpragsdale.com) {
        return 301 https://michaelpragsdale.com$request_uri;
    }

    # Deny access (`403 Forbidden`) to hidden system and version control files (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # 1. Pre-Rendered HTML Entry Documents (`*.html` — Revalidate on every visit):
    # Why `no-cache, must-revalidate` on HTML when JS/CSS below is cached for 1 year?
    #   All 43 pre-rendered `<route>/index.html` files are tiny and contain the
    #   `<script src="main-XYZ123.js">` filenames! When `sarah-deploy.sh` deploys a new
    #   Angular build, the hash `XYZ123` changes. Revalidating `.html` ensures visitors
    #   landing on `/`, `/web-apps`, or `/case-studies/...` immediately get the new hashes!
    #   (Note: exact `location = /404.html` below takes precedence over `~*` regex in Nginx.)
    # Security Headers Explained:
    #   - `X-Content-Type-Options: "nosniff"` prevents browsers from "MIME-sniffing"
    #     (guessing that a text or image file is executable JS), blocking a classic XSS vector
    #     alongside app-level Content-Security-Policy (CSP) rules.
    #   - `Referrer-Policy: "strict-origin-when-cross-origin"` shares the full URL on
    #     same-site navigation, only the bare origin (`https://michaelpragsdale.com`) when
    #     linking out to another HTTPS site, and nothing at all if downgrading to HTTP.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 2. Angular Content-Hashed JS & CSS Bundles (Immutable 1-Year Cache):
    # Angular's production compiler names files like `main-7F9A2C.js` and `styles-3B1D4E.css`.
    # Because any code edit produces a brand-new filename, we can safely tell browsers
    # `max-age=31536000, immutable` (keep in local disk cache for 365 days without re-asking!).
    location ~* \.(?:js|mjs|css)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 3. Static Media, Icons & Web Fonts (30-Day Cache = `2,592,000` seconds):
    # Note that PDF resumes under `/portfolio/documents/...` are served via `assets.raggiesoft.com`
    # or direct static paths (`try_files $uri` below) rather than this image/font regex.
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|eot|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 4. Genuine HTTP 404 & Retired Case-Study HTTP 410 Gone Routing (Zero Soft-404s):
    # Strip non-root trailing slashes via `301`, and wire `error_page 404` & `410` to `/404.html`.
    rewrite ^/(.+)/$ /$1 permanent;
    error_page 404 /404.html;
    error_page 410 /404.html;
    location = /404.html {
        internal;
    }

    # Named internal handler returning HTTP `410 Gone` + `X-Robots-Tag: noindex, noarchive, nosnippet`
    # for any `/case-studies/<slug>` route that is no longer present in the pre-rendered build.
    # Why `410 Gone` instead of `404` under `/case-studies/`?
    #   Under RFC 9110, `410 Gone` explicitly tells Googlebot, Bingbot, and link caches that a
    #   retired case study slug has been permanently removed with no forwarding address, triggering
    #   rapid search-index & cache eviction without ever naming retired slugs in version control!
    location @case_study_gone {
        add_header X-Robots-Tag "noindex, noarchive, nosnippet" always;
        return 410;
    }

    location /case-studies/ {
        try_files $uri $uri/index.html @case_study_gone;
    }

    # Compare `try_files` here vs. pure client-only SPAs vs. PHP front controllers:
    #   - A pure client-only SPA often writes `try_files $uri $uri/ /index.html (without =404)` so
    #     Angular's client router handles every URL—but that returns HTTP `200 OK` even
    #     for bogus URLs (`/asdf`), hurting SEO ("soft-404").
    #   - Because this portfolio pre-renders valid routes to `<route>/index.html`,
    #     `try_files $uri $uri/index.html =404;` serves valid routes instantly AND
    #     returns a genuine HTTP `404` for unknown paths!
    location / {
        try_files $uri $uri/index.html =404;
    }

    # ------------------------------------------------------------------------
    # SSL Configuration (Cloudflare Origin CA Certificate for michaelpragsdale.com)
    # ------------------------------------------------------------------------
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/michaelpragsdale.pem;
    ssl_certificate_key /etc/nginx/ssl/michaelpragsdale.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS INSECURE TRAFFIC REDIRECTION (PORT 80 -> PORT 443)
# ----------------------------------------------------------------------------
# Redirects both `http://michaelpragsdale.com` and `http://www.michaelpragsdale.com`
# directly to `https://michaelpragsdale.com` in a single `301` hop (zero redirect chains!).
server {
    listen 80;
    listen [::]:80;
    server_name michaelpragsdale.com www.michaelpragsdale.com;

    return 301 https://michaelpragsdale.com$request_uri;
}
