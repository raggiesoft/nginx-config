# ============================================================================
# Architectural Block: michaelpragsdale.com.conf
# ============================================================================
# Domain: michaelpragsdale.com (Executive Systems Architect Dossier)
# Repository: /raggiesoft-portfolio
# Platform: Angular 19 (Zoneless Signals + Standalone Components) + Native CSS
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# Upstream CDN / DNS: Cloudflare (Proxied A / AAAA Records)
#
# Key Architectural Responsibilities:
# 1. Zero-Redirect Direct Serving: Serves the Executive Systems Architect Dossier
#    directly at `https://michaelpragsdale.com` from `/var/www/michaelpragsdale.com`.
# 2. Canonical Host Enforcement: Redirects `www.michaelpragsdale.com` to the apex
#    domain `https://michaelpragsdale.com` via 301 Permanent Redirect.
# 3. High-Velocity Asset Caching:
#    - Content-hashed Angular bundles (`main-*.js`, `styles-*.css`, `chunk-*.js`)
#      are cached immutably for 1 year (`max-age=31536000, immutable`).
#    - `index.html` is served with `Cache-Control: no-cache` so new deployments
#      propagated by Sarah take effect immediately on client refresh.
# 4. Security & TLS:
#    - Uses `/etc/nginx/ssl/raggiesoft.pem` by default so `nginx -t` succeeds
#      immediately on the Droplet (or swap to `/etc/nginx/ssl/michaelpragsdale.pem`
#      when provisioning a dedicated Cloudflare Origin CA certificate).
#
# Deployment Architecture on DigitalOcean:
# 1. Sarah Autonomous Deployment (`/home/michael/raggiesoft-deployment-tools/sarah-deploy.sh`)
#    pulls `/home/michael/raggiesoft-portfolio` and rsyncs the compiled Angular
#    browser bundle (`dist/raggiesoft-portfolio/browser/`) into `/var/www/michaelpragsdale.com`.
# 2. Web Root Provisioning (one-time on Droplet):
#    sudo mkdir -p /var/www/michaelpragsdale.com && sudo chown -R michael:michael /var/www/michaelpragsdale.com
# 3. Link Nginx Config & Reload:
#    sudo cp /home/michael/nginx-config/michaelpragsdale.com.conf /etc/nginx/sites-available/michaelpragsdale.com.conf
#    sudo ln -sf /etc/nginx/sites-available/michaelpragsdale.com.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

server {
    server_name michaelpragsdale.com www.michaelpragsdale.com;
    root /var/www/michaelpragsdale.com;

    access_log /var/log/nginx/michaelpragsdale_access.log;
    error_log /var/log/nginx/michaelpragsdale_error.log;

    index index.html;

    # Canonical Apex Redirect (www -> non-www)
    if ($host = www.michaelpragsdale.com) {
        return 301 https://michaelpragsdale.com$request_uri;
    }

    # Deny access to hidden system and version control files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    # 1. Entry HTML Document (Revalidate on every visit for instant updates)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 2. Angular Content-Hashed JS & CSS Bundles (Immutable 1-Year Cache)
    location ~* \.(?:js|mjs|css)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 3. Static Media, Icons & Fonts (30-Day Cache)
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|eot|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 4. Core Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------------
    # SSL Configuration (Cloudflare Origin Proxy)
    # ------------------------------------------------------------------------
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# HTTP to HTTPS Insecure Traffic Redirection
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name michaelpragsdale.com www.michaelpragsdale.com;

    return 301 https://michaelpragsdale.com$request_uri;
}

