# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://raggiesoftstudio.com`
#   (**RaggieSoft Studio** — umbrella Windows 11 developer, packaging, accessibility
#   & digital-distribution suite housing **Installer Studio** at `/installer-studio/*`,
#   **Accessibility Studio** at `/accessibility-studio/*`, **Launcher Studio** at
#   `/launcher-studio`, and **Showcase Studio** at `/showcase-studio`), PLUS the
#   permanent 1-hop `301` campaign domain redirect for **`installwithoutlimits.com`**!
#
# Why does it exist in the ecosystem?
#   1. During `npm run build`, Vite and `scripts/prerender.mjs` compile all Suite
#      and `/installer-studio/*` routes into static HTML5, mount the IBM Carbon
#      Design System **Accessibility Studio** sub-portal at `/accessibility-studio/*`,
#      and publish `/llms.txt`, `/installer-studio/llms-full.txt`, and VPAT 2.5 HTML5
#      into `/var/www/raggiesoftstudio.com`.
#   2. Legacy root Installer Studio URLs (`/screenshots`, `/roadmap`, `/docs/*`,
#      `/faq`, `/changelog`, `/vpat`, `/accessibility`, `/security`, and `/suite`)
#      permanently `301` redirect in 1 hop to their canonical `/installer-studio/*`
#      (or `/`) destinations.
#   3. Visiting `installwithoutlimits.com` permanently `301` redirects in 1 hop
#      directly to `https://raggiesoftstudio.com/installer-studio` (`$request_uri`).
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`raggiesoftstudio.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS traffic for bare apex and `www.` subdomain.
    server_name raggiesoftstudio.com www.raggiesoftstudio.com;

    # Linux static showroom directory populated & minified by `sarah-deploy.sh`.
    root /var/www/raggiesoftstudio.com;

    # Dedicated Nginx access and error logs.
    access_log /var/log/nginx/raggiesoftstudio_access.log;
    error_log /var/log/nginx/raggiesoftstudio_error.log;

    # Default directory index document and UTF-8 charset for `.txt` / `.html` specs.
    index index.html;
    charset utf-8;

    # Canonical Apex Redirect (`www.raggiesoftstudio.com` -> `raggiesoftstudio.com`).
    if ($host = www.raggiesoftstudio.com) {
        return 301 https://raggiesoftstudio.com$request_uri;
    }

    # Block external access (`403 Forbidden`) to hidden dot-files (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: strip trailing slashes on non-root paths via `301`.
    rewrite ^/(.+)/$ /$1 permanent;

    # 1-Hop Permanent `301` Redirects for Former Root Suite & Installer Studio Paths:
    # `/suite` now lives directly at the Suite-First homepage `/`.
    location ~ ^/suite(?:\.html)?$ {
        return 301 https://raggiesoftstudio.com/$is_args$args;
    }

    # Legacy root Installer Studio pages redirect cleanly into `/installer-studio/*`.
    location ~ ^/(screenshots|roadmap|faq|changelog|vpat|accessibility|security)(?:\.html)?$ {
        return 301 https://raggiesoftstudio.com/installer-studio/$1$is_args$args;
    }

    # Legacy root `/docs` and `/docs/<topicId>` chapters redirect into `/installer-studio/docs/*`.
    location ~ ^/docs(?:\.html)?$ {
        return 301 https://raggiesoftstudio.com/installer-studio/docs$is_args$args;
    }
    location ~ ^/docs/(.+?)(?:\.html)?$ {
        return 301 https://raggiesoftstudio.com/installer-studio/docs/$1$is_args$args;
    }

    # Temporary redirect (`302`) while commercial pricing is deferred during Technical Preview!
    location ~ ^/(?:installer-studio/)?pricing(?:\.html)?$ {
        return 302 https://raggiesoftstudio.com/installer-studio;
    }

    # Genuine HTTP 404 Error Page (`dist/404.html` marked `noindex,follow`).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    location = /accessibility-studio/404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached 1 hour (`3600`s) for search crawlers.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # AI Agent Skill & Roadmap (`SKILL.md`, `ROADMAP.md`): served inline as UTF-8 Markdown.
    location ~* \.md$ {
        default_type "text/markdown; charset=utf-8";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Static SSG Route Resolution (`try_files` ending in `=404` — zero soft-404s!).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Long-Lived Caching (`6M`) for Content-Hashed Vite Assets.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Origin SSL Certificate & Modern TLS 1.2 / 1.3 Ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. INSTALLER STUDIO TAGLINE DOMAIN 1-HOP 301 REDIRECT (`installwithoutlimits.com`)
# ----------------------------------------------------------------------------
# Permanently funnels `installwithoutlimits.com` (and `www.installwithoutlimits.com`)
# directly to `https://raggiesoftstudio.com/installer-studio` in a single HTTP 301 hop:
#   - `https://installwithoutlimits.com/`         -> `https://raggiesoftstudio.com/installer-studio`
#   - `https://installwithoutlimits.com/roadmap`  -> `https://raggiesoftstudio.com/installer-studio/roadmap`
#   - `https://installwithoutlimits.com/installer-studio/...` -> `https://raggiesoftstudio.com/installer-studio/...`
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name installwithoutlimits.com www.installwithoutlimits.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    location = / {
        return 301 https://raggiesoftstudio.com/installer-studio$is_args$args;
    }

    location ^~ /installer-studio {
        return 301 https://raggiesoftstudio.com$request_uri;
    }

    location / {
        return 301 https://raggiesoftstudio.com/installer-studio$request_uri;
    }
}

# ----------------------------------------------------------------------------
# 3. HTTP-TO-HTTPS REDIRECT (`http://raggiesoftstudio.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name raggiesoftstudio.com www.raggiesoftstudio.com;

    return 301 https://raggiesoftstudio.com$request_uri;
}
