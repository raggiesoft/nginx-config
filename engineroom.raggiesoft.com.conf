# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://engineroom.raggiesoft.com`
#   (the official music-imprint portal for Engine Room Records, built with Astro 6
#   Static Site Generation / SSG).
#
# Why does it exist in the ecosystem?
#   It serves Astro's pre-rendered static HTML pages from `/var/www/engineroom.raggiesoft.com`,
#   normalizes legacy artist/imprint URLs via permanent `301` redirects, and funnels
#   two standalone RaggieSoft-owned music domains—`engineroom-records.com` and
#   `fracturedprisms.com`—directly into `engineroom.raggiesoft.com` so all label
#   rosters, catalogs, and licensing pages live under the unified `*.raggiesoft.com`
#   subdomain architecture.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) traffic for
#     `engineroom.raggiesoft.com`, `engineroom-records.com`, and `fracturedprisms.com`.
#   - Outputs: Serves pre-rendered Astro HTML (`200 OK`) or `/404.html` (`404 Not Found`),
#     caches static assets for 7 days and XML sitemaps for 1 hour, and executes
#     permanent `301` redirects for legacy paths and vanity domains.
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`engineroom.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match incoming HTTPS requests for `engineroom.raggiesoft.com`.
    server_name engineroom.raggiesoft.com;

    # Linux directory containing the compiled Astro 6 static build (`dist/`).
    root /var/www/engineroom.raggiesoft.com;

    # Per-subdomain access and error logs.
    access_log /var/log/nginx/engineroom.raggiesoft_access.log;
    error_log /var/log/nginx/engineroom.raggiesoft_error.log;

    # Default file served for directory roots (`/`).
    index index.html;

    # Security rule: block any hidden dot-file or dot-folder (`.git`, `.env`, etc.).
    location ~ /\. {
        deny all;
    }

    # Legacy & Vanity Path Normalization Redirects (`permanent` = HTTP 301):
    # If external bookmarks or older pages link to `/artists/stardust-engine` (without `the-`)
    # or older top-level `/stardust-blacksburg` / `/pacific-rim` paths, Nginx seamlessly
    # redirects visitors and search crawlers to their current canonical locations.
    # (`$1` captures whatever sub-path matched inside `(.+)`!).
    rewrite ^/artists/stardust-engine/?$ /artists/the-stardust-engine permanent;
    rewrite ^/stardust-blacksburg/?$ /corporate/stardust-blacksburg permanent;
    rewrite ^/stardust-blacksburg/(.+)$ /corporate/stardust-blacksburg/$1 permanent;
    rewrite ^/pacific-rim(.*)$ /corporate/pacific-rim permanent;

    # Canonical URL Normalization: strip trailing slashes from all non-root URLs.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Page: displays Astro's `/404.html` with a real `404` status code
    # instead of returning `200 OK` on broken URLs (`internal;` blocks direct `/404.html` hits).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap-index.xml`, `sitemap-0.xml`): cached for 1 hour (`3600`s).
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Astro 6 Static SSG Route Resolution (`location /`):
    # Compare the three `try_files` patterns used in web engineering:
    #   - Static SSG (HERE): `try_files $uri $uri.html $uri/index.html =404;`
    #     Astro pre-builds every route into static HTML at compile time, so Nginx
    #     serves it straight from disk and emits `=404` for any non-existent route.
    #   - Client SPA Fallback: `try_files $uri /index.html (without =404)` (used only when routes
    #     aren't pre-rendered on disk and must be resolved by client-side JS).
    #   - PHP Front-Controller: `try_files $uri /index.php?$query_string;` (passes
    #     dynamic requests to PHP-FPM).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Static Assets (icons, artwork, fonts, CSS, JS, JSON): cached for 7 days (`604800`s).
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js|json)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Wildcard Origin SSL Certificate (`*.raggiesoft.com`) & TLS 1.2 / 1.3 Ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. VANITY DOMAIN 301 REDIRECTS (`engineroom-records.com` & `fracturedprisms.com`)
# ----------------------------------------------------------------------------
# Why do `engineroom-records.com` and `fracturedprisms.com` 301-redirect to subdomains?
#   1. Subdomain-First Architecture: Consolidating every imprint under `*.raggiesoft.com`
#      prevents search engines from seeing two identical copies of Engine Room Records
#      at different domains, concentrating 100% of link equity on `engineroom.raggiesoft.com`.
#   2. Path Preservation (`$request_uri`): Visiting `engineroom-records.com/roster`
#      automatically redirects to `https://engineroom.raggiesoft.com/roster`, while
#      `fracturedprisms.com` lands directly on Fractured Prisms' official artist page!
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name engineroom-records.com www.engineroom-records.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://engineroom.raggiesoft.com$request_uri;
}

# Artist Vanity Domain 301 Redirect: `fracturedprisms.com` -> `/artists/fractured-prisms`
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fracturedprisms.com www.fracturedprisms.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://engineroom.raggiesoft.com/artists/fractured-prisms;
}

# ----------------------------------------------------------------------------
# 3. HTTP-TO-HTTPS REDIRECT (`http://engineroom.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name engineroom.raggiesoft.com;

    if ($host = engineroom.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
