# ============================================================================
# Architectural Block: engineroom.raggiesoft.com.conf
# ============================================================================
# Domain: engineroom.raggiesoft.com (Engine Room Records Official Imprint Hub)
# Repository: /raggiesoft-engine-room-records (Local: /raggiesoft.com/subdomains/engineroom)
# Platform: Astro 6 Static Site Generation (SSG)
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
#
# Vanity Domain 301 Redirects:
# - engineroom-records.com -> https://engineroom.raggiesoft.com$request_uri
# - fracturedprisms.com    -> https://engineroom.raggiesoft.com/artists/fractured-prisms
# ============================================================================

server {
    server_name engineroom.raggiesoft.com;
    root /var/www/engineroom.raggiesoft.com;

    access_log /var/log/nginx/engineroom.raggiesoft_access.log;
    error_log /var/log/nginx/engineroom.raggiesoft_error.log;

    index index.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js|json)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# Vanity Domain 301 Redirect: engineroom-records.com -> engineroom.raggiesoft.com
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name engineroom-records.com www.engineroom-records.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://engineroom.raggiesoft.com$request_uri;
}

# Vanity Domain 301 Redirect: fracturedprisms.com -> engineroom.raggiesoft.com/artists/fractured-prisms
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fracturedprisms.com www.fracturedprisms.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://engineroom.raggiesoft.com/artists/fractured-prisms;
}

server {
    listen 80;
    listen [::]:80;
    server_name engineroom.raggiesoft.com;

    if ($host = engineroom.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

