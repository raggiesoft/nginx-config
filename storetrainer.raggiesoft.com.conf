# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://storetrainer.raggiesoft.com`
#   (the official preservation & download portal for RaggieSoft StoreTrainer, a
#   classic pre-AI VB6/Win32 & .NET PC game/trainer launcher styled in nostalgic
#   Win32 / Netscape Communicator 4.78 CSS and compiled as a Vanilla TypeScript
#   Static Site Generation / SSG build).
#
# Why does it exist in the ecosystem?
#   Classic Windows NSIS installers for StoreTrainer open `raggiesoft.com/products/storetrainer`
#   when installation finishes (which `raggiesoft.com.conf` 301-redirects here).
#   This Nginx config serves the compiled static site and `.exe` installer binaries
#   directly from `/var/www/storetrainer.raggiesoft.com` over encrypted HTTPS.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for `storetrainer.raggiesoft.com`.
#   - Outputs: Redirects HTTP to HTTPS (`301`), strips trailing slashes, resolves
#     clean static URLs (`200 OK`) or `/404.html` (`404 Not Found`), caches XML
#     sitemaps for 1 hour, and caches static assets (including `.exe` installers!)
#     for 7 days.
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`storetrainer.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS requests addressed to `storetrainer.raggiesoft.com`.
    server_name storetrainer.raggiesoft.com;

    # Filesystem root containing the built StoreTrainer static pages and assets.
    root /var/www/storetrainer.raggiesoft.com;

    # Access and error log paths on the Droplet.
    access_log /var/log/nginx/storetrainer.raggiesoft_access.log;
    error_log /var/log/nginx/storetrainer.raggiesoft_error.log;

    # Default file served when visiting `/`.
    index index.html;

    # Security rule: deny external access (`403 Forbidden`) to hidden dot-files (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: strip trailing slashes on non-root paths via `301` redirect.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Error Page (`internal;` ensures `/404.html` is only used on real 404 errors).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached for 1 hour (`3600` seconds).
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Static SSG Route Resolution (`location /`):
    # Compare how `try_files` works across SSG, SPA, and PHP architectures:
    #   - Static SSG (HERE): `try_files $uri $uri.html $uri/index.html =404;`
    #     Checks exact file, `.html` file, or folder `index.html`, returning a real
    #     HTTP `404` if none exist (preventing soft-404 search-index pollution).
    #   - Client SPA Fallback: `try_files $uri /index.html (without =404)` (hands all paths to JS).
    #   - PHP Front-Controller: `try_files $uri /router.php?$query_string;` (passes to PHP-FPM).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Static Assets & Downloadable Windows Binaries (`.exe`):
    # Notice `exe` at the end of the file-extension group! Caching images, stylesheets,
    # scripts, and `.exe` downloads for 7 days (`604800`s) lets Cloudflare's edge serve
    # repeat downloads without taxing the origin Droplet.
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js|json|exe)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Wildcard SSL Certificate (`*.raggiesoft.com`) & TLS 1.2 / 1.3 Cipher Suite
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS REDIRECT (`http://storetrainer.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name storetrainer.raggiesoft.com;

    if ($host = storetrainer.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
