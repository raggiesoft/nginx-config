# ============================================================================
# Architectural Block: storetrainer.raggiesoft.com.conf
# ============================================================================
# Domain: storetrainer.raggiesoft.com (RaggieSoft StoreTrainer Official Portal)
# Repository: /raggiesoft-storetrainer (Local: /raggiesoft.com/subdomains/storetrainer)
# Platform: Vanilla TypeScript + Classic Win32 / Netscape Communicator 4.78 Static SSG
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
#
# Legacy Installer Redirect Note:
# - https://raggiesoft.com/products/storetrainer* 301 redirects here via
#   raggiesoft.com.conf and elara.php.
# ============================================================================

server {
    server_name storetrainer.raggiesoft.com;
    root /var/www/storetrainer.raggiesoft.com;

    access_log /var/log/nginx/storetrainer.raggiesoft_access.log;
    error_log /var/log/nginx/storetrainer.raggiesoft_error.log;

    index index.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js|json|exe)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

server {
    listen 80;
    listen [::]:80;
    server_name storetrainer.raggiesoft.com;

    if ($host = storetrainer.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

