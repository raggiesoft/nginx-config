# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx ("engine-x") Virtual Host configuration for
#   `https://waystation.raggiesoft.com` (**The Uncharted Waystation** — our
#   1980s Fantasy-Adventure RaggieSoft Universe directory built with
#   **Mithril.js + TypeScript Hyperscript Static SSG**) AND the **Default
#   HTTP 404 Catch-All Server (`default_server`)** for any unconfigured or
#   mistyped `*.raggiesoft.com` subdomain!
#
# How the Dual-Server Architecture Works:
#   1. Canonical Host (`server_name waystation.raggiesoft.com;` on port 443):
#      Visitors going intentionally to `https://waystation.raggiesoft.com/`
#      receive standard `HTTP 200 OK` responses for `/`, `/guides`, and `/realms`
#      (and `HTTP 404` via `/404.html` for unknown paths).
#   2. Catch-All Unconfigured Subdomain Guard (`listen 443 ssl default_server;`):
#      Earlier, before an explicit `default_server` existed, any new or mistyped
#      `*.raggiesoft.com` subdomain fell back to the first alphabetical `.conf`
#      file (`backstage.raggiesoft.com.conf`) with a misleading `200 OK`!
#      Now, `default_server` intercepts ANY unrecognized hostname, serves static
#      CSS/JS assets cleanly from `/var/www/waystation.raggiesoft.com/assets/`,
#      stamps `X-Robots-Tag: noindex, follow` so search crawlers never index typo
#      subdomains, and returns a genuine **`HTTP 404 Not Found`** rendered by
#      `/404.html`—where Nolan & Gwen Lennox point lost travelers to the exact
#      RaggieSoft world they were looking for!
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. CANONICAL HTTPS HOST (`https://waystation.raggiesoft.com` -> 200 OK)
# ----------------------------------------------------------------------------
server {
    server_name waystation.raggiesoft.com;
    root /var/www/waystation.raggiesoft.com;

    access_log /var/log/nginx/waystation.raggiesoft_access.log;
    error_log /var/log/nginx/waystation.raggiesoft_error.log;

    index index.html;

    # Block external access to hidden dot-files (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # Normalize trailing slashes (`/realms/` -> `/realms`) via 301 redirect.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 page (`dist/404.html` marked `noindex,follow`).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Cache XML sitemaps for 1 hour.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Pre-rendered Mithril SSG routes (`=404` prevents soft-404s).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Long-lived immutable cache for static CSS, Mithril JS bundle, and icons.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. DEFAULT CATCH-ALL HTTPS 404 SERVER (UNCONFIGURED `*.raggiesoft.com` TYPOS)
# ----------------------------------------------------------------------------
server {
    # `default_server` overrides alphabetical `.conf` ordering across Nginx!
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /var/www/waystation.raggiesoft.com;

    access_log /var/log/nginx/uncharted.raggiesoft_access.log;
    error_log /var/log/nginx/uncharted.raggiesoft_error.log;

    location ~ /\. {
        deny all;
    }

    # Allow the 404 page's local `/assets/waystation.css`, `/assets/waystation-app.js`,
    # root-level Waystation favicons, and `/site.webmanifest` to load with 200 OK so
    # even unmapped `*.raggiesoft.com` 404 pages render their tab icon & CSS cleanly!
    location ^~ /assets/ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(?:favicon\.(?:ico|svg)|favicon-96x96\.png|apple-touch-icon\.png|web-app-manifest-(?:192x192|512x512)\.png|site\.webmanifest)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000";
        try_files $uri =404;
    }

    # Render `/404.html` internally whenever `return 404;` triggers below.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Every route on an unconfigured subdomain returns a real HTTP 404 status!
    location / {
        add_header X-Robots-Tag "noindex, follow" always;
        return 404;
    }

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 3. DEFAULT HTTP-TO-HTTPS REDIRECT (PORT 80 -> PORT 443)
# ----------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name waystation.raggiesoft.com _;

    return 301 https://$host$request_uri;
}
