# ============================================================================
# Architectural Block: corporate.raggiesoft.com.conf
# ============================================================================
# Domain: corporate.raggiesoft.com (RaggieSoft Media B2B & Licensing Hub)
# Repository: /raggiesoft-corporate (Local: /raggiesoft.com/subdomains/corporate)
# Platform: Bootstrap 5.3.8 Static Site Generation (SSG)
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
#
# Vanity Domain 301 Redirects:
# - raggiesoftmedia.com     -> https://corporate.raggiesoft.com$request_uri
# - stardustenginecms.com   -> https://corporate.raggiesoft.com/projects/stardust-engine-cms
# ============================================================================

server {
    server_name corporate.raggiesoft.com;
    root /var/www/corporate.raggiesoft.com;

    access_log /var/log/nginx/corporate.raggiesoft_access.log;
    error_log /var/log/nginx/corporate.raggiesoft_error.log;

    index index.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js|json)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# Vanity Domain 301 Redirect: raggiesoftmedia.com -> corporate.raggiesoft.com
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name raggiesoftmedia.com www.raggiesoftmedia.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://corporate.raggiesoft.com$request_uri;
}

# Vanity Domain 301 Redirect: stardustenginecms.com -> corporate.raggiesoft.com/projects/stardust-engine-cms
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stardustenginecms.com www.stardustenginecms.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://corporate.raggiesoft.com/projects/stardust-engine-cms;
}

server {
    listen 80;
    listen [::]:80;
    server_name corporate.raggiesoft.com;

    if ($host = corporate.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

