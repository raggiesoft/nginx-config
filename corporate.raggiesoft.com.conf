# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://corporate.raggiesoft.com`
#   (the RaggieSoft Media B2B, Brand Architecture & Licensing Hub).
#
# Why does it exist in the ecosystem?
#   `corporate.raggiesoft.com` is compiled ahead of time into static HTML, CSS,
#   and JS files (Bootstrap 5.3.8 Static Site Generation / SSG). Nginx serves
#   those pre-built files directly from `/var/www/corporate.raggiesoft.com`
#   with zero server-side scripting overhead, while also permanently redirecting
#   two RaggieSoft-owned vanity domains (`raggiesoftmedia.com` and
#   `stardustenginecms.com`) into their canonical `corporate.raggiesoft.com` homes.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for
#     `corporate.raggiesoft.com`, `raggiesoftmedia.com`, and `stardustenginecms.com`.
#   - Outputs: Enforces HTTPS (`301`), strips trailing slashes, maps clean URLs
#     like `/licensing` to `/licensing.html` or `/licensing/index.html`, serves
#     `/404.html` with a genuine HTTP `404` status on missing URLs, caches static
#     assets for 7 days, and redirects both vanity domains via `301 Moved Permanently`.
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`corporate.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS requests addressed to `corporate.raggiesoft.com`.
    server_name corporate.raggiesoft.com;

    # Folder on the Linux server where `sarah-deploy.sh` places the built static files.
    root /var/www/corporate.raggiesoft.com;

    # Access and error log paths for server diagnostics.
    access_log /var/log/nginx/corporate.raggiesoft_access.log;
    error_log /var/log/nginx/corporate.raggiesoft_error.log;

    # Default file served when requesting `/`.
    index index.html;

    # Deny access (`403 Forbidden`) to any hidden dot-files such as `.git` or `.env`.
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: permanently strip trailing slashes on non-root paths
    # (`/licensing/` -> `301` redirect to `/licensing`) so search engines see one URL.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Error Handling:
    # When `try_files` below hits `=404`, Nginx renders `/404.html` while keeping the
    # HTTP response status code as `404 Not Found` (`internal;` blocks direct `/404.html` visits).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached for 1 hour (`3600`s) so crawlers pick up new pages quickly.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Static SSG Route Resolution (`location /`):
    # Compare how Nginx resolves URLs across different web architectures:
    #   - Static SSG (HERE): `try_files $uri $uri.html $uri/index.html =404;`
    #     For `/licensing`, Nginx checks `/licensing`, then `/licensing.html`, then
    #     `/licensing/index.html`, and returns a real `404` if none exist on disk.
    #   - Client-Only SPA: `try_files $uri /index.html (without =404)` (always serves `index.html`
    #     so React/Vue JS can route in the browser, risking "soft-404s" if not careful).
    #   - PHP Front-Controller: `try_files $uri /router.php?$query_string;` (passes
    #     dynamic routes to PHP-FPM).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Static Assets & Data Files: cache in browsers and Cloudflare edge for 7 days (`604800`s).
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js|json)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Wildcard SSL Certificate & TLS 1.2 / 1.3 Cipher Suite
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. VANITY DOMAIN 301 REDIRECTS (SUBDOMAIN-FIRST CONSOLIDATION)
# ----------------------------------------------------------------------------
# Why redirect `raggiesoftmedia.com` and `stardustenginecms.com` to `corporate.raggiesoft.com`?
#   Maintaining one canonical `*.raggiesoft.com` subdomain prevents duplicate-content
#   SEO penalties and keeps navigation unified across the RaggieSoft Network bar.
#   - Notice `$request_uri` on `raggiesoftmedia.com`: visiting `raggiesoftmedia.com/licensing`
#     preserves the path and lands on `https://corporate.raggiesoft.com/licensing`!
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name raggiesoftmedia.com www.raggiesoftmedia.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://corporate.raggiesoft.com$request_uri;
}

# Dedicated Product Domain Redirect: `stardustenginecms.com` lands directly on the
# Stardust Engine CMS architecture showcase page (`/projects/stardust-engine-cms`).
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stardustenginecms.com www.stardustenginecms.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://corporate.raggiesoft.com/projects/stardust-engine-cms;
}

# ----------------------------------------------------------------------------
# 3. HTTP-TO-HTTPS REDIRECT (`http://corporate.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name corporate.raggiesoft.com;

    if ($host = corporate.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
