# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://raggiesoft.dev`
#   (**RaggieSoft Developer & Open-Source Engineering Hub**, built with
#   Alpine.js + TypeScript + Vite Static SSG).
#
# Why does it exist in the ecosystem?
#   Serves pre-rendered static HTML routes (`/`, `/labs`, `/labs/finsharp`,
#   `/repositories`, `/ai-skills`, `/notes`), `/404.html`, `/sitemap.xml`, and
#   `/llms.txt` directly from `/var/www/raggiesoft.dev` (deployed & minified by
#   `sarah-deploy.sh`), kept in 1:1 lockstep with `raggiesoftstudio.com`!
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`raggiesoft.dev` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS traffic for bare apex and `www.` subdomain.
    server_name raggiesoft.dev www.raggiesoft.dev;

    # Linux showroom directory populated & minified by `sarah-deploy.sh`.
    root /var/www/raggiesoft.dev;

    # Dedicated Nginx access and error logs.
    access_log /var/log/nginx/raggiesoft_dev_access.log;
    error_log /var/log/nginx/raggiesoft_dev_error.log;

    # Default directory index document and UTF-8 charset for `/llms.txt` & HTML.
    index index.html;
    charset utf-8;

    # Canonical Apex Redirect (`www.raggiesoft.dev` -> `raggiesoft.dev`).
    if ($host = www.raggiesoft.dev) {
        return 301 https://raggiesoft.dev$request_uri;
    }

    # Block external access (`403 Forbidden`) to hidden dot-files (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: strip trailing slashes on non-root paths via `301`.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Error Page (`dist/404.html` marked `noindex,follow`).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached 1 hour (`3600`s) for search crawlers.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Markdown Specs (`*.md`): served inline as UTF-8 Markdown rather than octet-stream.
    location ~* \.md$ {
        default_type "text/markdown; charset=utf-8";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Static SSG Route Resolution (`try_files` ending in `=404` — zero soft-404s!).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Long-Lived Caching (`6M`) for Content-Hashed Vite Assets.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Origin SSL Certificate & Modern TLS 1.2 / 1.3 Ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS REDIRECT (`http://raggiesoft.dev` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name raggiesoft.dev www.raggiesoft.dev;

    return 301 https://raggiesoft.dev$request_uri;
}
