# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://raggiesoft.com`
#   (the central RaggieSoft Hub, powered by PHP 8.5-FPM and the Stardust Engine
#   CMS `/amanda/elara.php` front controller).
#
# Why does it exist in the ecosystem?
#   Historically, almost every RaggieSoft section lived inside sub-folders of
#   `raggiesoft.com` (such as `/raggiesoft-books/...`, `/engine-room/...`,
#   `/encyclopedia/...`, `/products/storetrainer`, and `/about/michael-ragsdale`).
#   As RaggieSoft evolved into its modern Subdomain-First Architecture
#   (`books.raggiesoft.com`, `engineroom.raggiesoft.com`, `stardust.raggiesoft.com`,
#   `lore.raggiesoft.com`, `corporate.raggiesoft.com`, `storetrainer.raggiesoft.com`,
#   and `michaelpragsdale.com`), this Nginx config acts as the master switchboard:
#   it permanently `301`-redirects every legacy path to its new dedicated domain
#   or subdomain while routing hub pages (`/`, `/in-memoriam`, etc.) to `elara.php`.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for `raggiesoft.com`
#     and `www.raggiesoft.com`.
#   - Outputs: Enforces bare `https://raggiesoft.com` (`301`), executes cross-domain
#     `301` SEO migrations, blocks direct access to `/includes/` (while permitting
#     embedded `/includes/components/apps/` mini-apps), protects images against
#     third-party bandwidth hotlinking, routes dynamic URLs to `/amanda/elara.php`,
#     and renders custom branded PHP error pages (`403` through `504`).
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Accept requests for both bare `raggiesoft.com` and `www.raggiesoft.com`.
    server_name raggiesoft.com www.raggiesoft.com;

    # Filesystem root on the Linux server.
    root /var/www/raggiesoft.com;

    # Main hub access and error logs.
    access_log /var/log/nginx/raggiesoft_access.log;
    error_log /var/log/nginx/raggiesoft_error.log;

    # Default directory index points to the Stardust Engine CMS front controller (`elara.php`).
    index amanda/elara.php;

    # Canonical Apex Redirect (`www.raggiesoft.com` -> `https://raggiesoft.com` via HTTP 301).
    if ($host = www.raggiesoft.com) {
        return 301 https://raggiesoft.com$request_uri;
    }

    # Block external access (`403 Forbidden`) to hidden dot-files like `.git` or `.env`.
    location ~ /\. {
        deny all;
    }

    # ------------------------------------------------------------------------
    # SUBDOMAIN-FIRST ARCHITECTURE & PORTFOLIO 301 PERMANENT REDIRECTS
    # ------------------------------------------------------------------------
    # Why use `301` (`permanent`) redirects for all of these legacy paths?
    #   An HTTP `301 Moved Permanently` tells browsers AND search engines (Google,
    #   Bing, DuckDuckGo) to transfer 100% of historical bookmarks and search ranking
    #   authority from the old `raggiesoft.com/...` sub-folder to the new standalone
    #   domain or `*.raggiesoft.com` subdomain!

    # Portfolio SEO Reversal: `/about/michael-ragsdale*` -> `https://michaelpragsdale.com/`
    # (`^~` matches any path starting with `/about/michael-ragsdale` immediately).
    location ^~ /about/michael-ragsdale {
        return 301 https://michaelpragsdale.com/;
    }

    # Legacy Windows NSIS Installer Finish-Page Endpoint -> `storetrainer.raggiesoft.com`
    location ^~ /products/storetrainer {
        return 301 https://storetrainer.raggiesoft.com/;
    }

    # RaggieSoft Media B2B & Licensing (`/raggiesoft-media*`) -> `corporate.raggiesoft.com`
    rewrite ^/raggiesoft-media/?$ https://corporate.raggiesoft.com/ permanent;
    rewrite ^/raggiesoft-media/(.+)$ https://corporate.raggiesoft.com/$1 permanent;

    # RaggieSoft Books (`/raggiesoft-books*`) -> `books.raggiesoft.com`
    rewrite ^/raggiesoft-books/stardust-engine(.*)$ https://books.raggiesoft.com/stardust-engine permanent;
    rewrite ^/raggiesoft-books/aethel-saga(.*)$ https://books.raggiesoft.com/aethel permanent;
    rewrite ^/raggiesoft-books/ocean-view-archives(.*)$ https://books.raggiesoft.com/library permanent;
    rewrite ^/raggiesoft-books(.*)$ https://books.raggiesoft.com/ permanent;

    # Universal Lore Encyclopedia (`/encyclopedia*`) -> `lore.raggiesoft.com`
    rewrite ^/encyclopedia(.*)$ https://lore.raggiesoft.com/ permanent;

    # The Stardust Engine Artist & Discography Paths -> `stardust.raggiesoft.com`
    # (`(?:the-)?` is a non-capturing group matching both `stardust-engine` and `the-stardust-engine`).
    rewrite ^/engine-room/artists/(?:the-)?stardust-engine/?$ https://stardust.raggiesoft.com/ permanent;
    rewrite ^/engine-room/artists/(?:the-)?stardust-engine/(.+)$ https://stardust.raggiesoft.com/$1 permanent;
    rewrite ^/engine-room/records/stardust-engine/?$ https://stardust.raggiesoft.com/discography permanent;
    rewrite ^/engine-room/records/stardust-engine/(.+)$ https://stardust.raggiesoft.com/discography/$1 permanent;

    # Engine Room Records, O'Connell Trust, Stardust Blacksburg, Pacific Rim -> `engineroom.raggiesoft.com`
    rewrite ^/oconnell-trust/?$ https://engineroom.raggiesoft.com/oconnell-trust permanent;
    rewrite ^/oconnell-trust/(.+)$ https://engineroom.raggiesoft.com/oconnell-trust/$1 permanent;
    rewrite ^/stardust-blacksburg/?$ https://engineroom.raggiesoft.com/corporate/stardust-blacksburg permanent;
    rewrite ^/stardust-blacksburg/(.+)$ https://engineroom.raggiesoft.com/corporate/stardust-blacksburg/$1 permanent;
    rewrite ^/pacific-rim(.*)$ https://engineroom.raggiesoft.com/corporate/pacific-rim permanent;
    rewrite ^/engine-room/licensing/?$ https://engineroom.raggiesoft.com/commercial-licensing permanent;
    rewrite ^/engine-room/?$ https://engineroom.raggiesoft.com/ permanent;
    rewrite ^/engine-room/(.+)$ https://engineroom.raggiesoft.com/$1 permanent;

    # ------------------------------------------------------------------------
    # SELECTIVE `/includes/` PROTECTION (ALLOW EMBEDDED APPS, BLOCK TEMPLATES)
    # ------------------------------------------------------------------------
    # More-specific prefix `^~ /includes/components/apps/` wins over `^~ /includes/` below,
    # allowing interactive mini-apps inside `/includes/components/apps/` to run PHP via
    # FastCGI while returning `404` / `deny all` for every internal PHP partial in `/includes/`!
    location ^~ /includes/components/apps/ {
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location ^~ /includes/ {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------------
    # IMAGE ANTI-HOTLINKING & 30-DAY CACHING
    # ------------------------------------------------------------------------
    # Prevents external scraper websites from embedding `raggiesoft.com` images directly
    # on their own pages and stealing server bandwidth:
    # - `valid_referers` whitelists empty/privacy-stripped referers (`none`, `blocked`),
    #   all 9 verified RaggieSoft domains/subdomains, and major search engine image results.
    # - If an unauthorized outside site hotlinks an image (`$invalid_referer` is truthy),
    #   Nginx temporarily redirects (`302`) that embed to `no-hotlink.jpg`!
    location ~* \.(gif|png|jpe?g|svg|webp|ico)$ {
        valid_referers none blocked server_names
                       *.raggiesoft.com
                       *.michaelpragsdale.com michaelpragsdale.com
                       *.engineroom-records.com engineroom-records.com
                       *.thestardustengine.com thestardustengine.com
                       *.fracturedprisms.com fracturedprisms.com
                       *.aethelsaga.com aethelsaga.com
                       *.raggiesoftknox.com raggiesoftknox.com
                       *.raggiesoftmedia.com raggiesoftmedia.com
                       *.stardustenginecms.com stardustenginecms.com
                       ~\.google\. ~\.bing\. ~\.yahoo\. ~\.duckduckgo\. ~\.yandex\.
                       ~\.ask\. ~\.lycos\. ~\.altavista\.;
        if ($invalid_referer) {
            return 302 https://assets.raggiesoft.com/common/images/no-hotlink.jpg;
        }
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    # ------------------------------------------------------------------------
    # ELARA PHP FRONT-CONTROLLER ROUTING & FASTCGI SOCKET
    # ------------------------------------------------------------------------
    # Compare `try_files` here vs. static SSG (`try_files $uri $uri.html $uri/index.html =404;`)
    # and client-side SPAs (`try_files $uri /index.html (without =404)`):
    # Here, if `$uri` is not a static file or folder on disk, Nginx passes the request
    # (plus `$query_string`) into `/amanda/elara.php`, which resolves Stardust Engine CMS
    # routes dynamically in PHP 8.5!
    location / {
        try_files $uri $uri/ /amanda/elara.php?$query_string;
    }

    # Execute `.php` scripts via PHP 8.5-FPM over the local Unix domain socket.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Custom Branded Error Pages (`403` Forbidden, `404` Not Found, `500`–`504` Server/Gateway Errors):
    # `internal;` on `/amanda/errors/` ensures visitors only see these error templates when an
    # actual error occurs, never by visiting `/amanda/errors/404.php` directly.
    error_page 403 /amanda/errors/403.php;
    error_page 404 /amanda/errors/404.php;
    error_page 500 /amanda/errors/500.php;
    error_page 502 /amanda/errors/502.php;
    error_page 503 /amanda/errors/503.php;
    error_page 504 /amanda/errors/504.php;

    location ^~ /amanda/errors/ {
        internal;
    }

    # HTTPS Listener & Wildcard SSL Certificate (`*.raggiesoft.com` + `raggiesoft.com`)
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS REDIRECT (`http://raggiesoft.com` / `www.` -> `https://raggiesoft.com`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name raggiesoft.com www.raggiesoft.com;
    return 301 https://raggiesoft.com$request_uri;
}
