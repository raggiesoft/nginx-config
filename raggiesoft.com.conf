# ============================================================================
# Architectural Block: raggiesoft.com.conf
# ============================================================================
# Domain: raggiesoft.com / www.raggiesoft.com (RaggieSoft Corporate Hub)
# Repository: /raggiesoft-hub
# Platform: PHP 8.5-FPM (Stardust Engine CMS / Elara Front Controller)
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
#
# Key Architectural Responsibilities:
# 1. Elara Front Controller Routing: Routes dynamic URI paths through
#    `/amanda/elara.php` while protecting internal `/includes/` directories.
# 2. Canonical SEO Reversal (`/about/michael-ragsdale` -> `michaelpragsdale.com`):
#    Issues an immediate HTTP 301 Moved Permanently redirect from any
#    `/about/michael-ragsdale*` path to `https://michaelpragsdale.com/`,
#    transferring search engine canonical authority back to the standalone
#    Executive Systems Architect Dossier.
# ============================================================================

server {
    server_name raggiesoft.com www.raggiesoft.com;
    root /var/www/raggiesoft.com;

    access_log /var/log/nginx/raggiesoft_access.log;
    error_log /var/log/nginx/raggiesoft_error.log;

    index amanda/elara.php;

    location ~ /\. {
        deny all;
    }

    # Canonical 301 Redirect: Transfer SEO authority for Michael P. Ragsdale's
    # portfolio from raggiesoft.com/about/michael-ragsdale* to michaelpragsdale.com
    location ^~ /about/michael-ragsdale {
        return 301 https://michaelpragsdale.com/;
    }

    # Canonical 301 Redirect: Legacy NSIS Installer Finish-Page Endpoint (/products/storetrainer) -> storetrainer.raggiesoft.com
    location ^~ /products/storetrainer {
        return 301 https://storetrainer.raggiesoft.com/;
    }

    # Canonical 301 Redirects: RaggieSoft Media (/raggiesoft-media*) -> corporate.raggiesoft.com
    rewrite ^/raggiesoft-media/?$ https://corporate.raggiesoft.com/ permanent;
    rewrite ^/raggiesoft-media/(.+)$ https://corporate.raggiesoft.com/$1 permanent;

    # Canonical 301 Redirects: RaggieSoft Books (/raggiesoft-books*) -> books.raggiesoft.com
    rewrite ^/raggiesoft-books/stardust-engine(.*)$ https://books.raggiesoft.com/read/stardust-engine permanent;
    rewrite ^/raggiesoft-books/aethel-saga(.*)$ https://books.raggiesoft.com/read/the-silver-gauntlet-of-aethel permanent;
    rewrite ^/raggiesoft-books/ocean-view-archives(.*)$ https://books.raggiesoft.com/read/the-ocean-view-archives permanent;
    rewrite ^/raggiesoft-books(.*)$ https://books.raggiesoft.com/ permanent;

    # Canonical 301 Redirects: Encyclopedia (/encyclopedia*) -> lore.raggiesoft.com
    rewrite ^/encyclopedia(.*)$ https://lore.raggiesoft.com/ permanent;

    # Canonical 301 Redirects: The Stardust Engine (/engine-room/artists/stardust-engine* & /engine-room/records/stardust-engine*) -> stardust.raggiesoft.com
    rewrite ^/engine-room/artists/(?:the-)?stardust-engine/?$ https://stardust.raggiesoft.com/ permanent;
    rewrite ^/engine-room/artists/(?:the-)?stardust-engine/(.+)$ https://stardust.raggiesoft.com/$1 permanent;
    rewrite ^/engine-room/records/stardust-engine/?$ https://stardust.raggiesoft.com/records/stardust-engine permanent;
    rewrite ^/engine-room/records/stardust-engine/(.+)$ https://stardust.raggiesoft.com/records/stardust-engine/$1 permanent;

    # Canonical 301 Redirects: Engine Room Records, O'Connell Trust, Stardust Blacksburg, Pacific Rim -> engineroom.raggiesoft.com
    rewrite ^/oconnell-trust/?$ https://engineroom.raggiesoft.com/oconnell-trust permanent;
    rewrite ^/oconnell-trust/(.+)$ https://engineroom.raggiesoft.com/oconnell-trust/$1 permanent;
    rewrite ^/stardust-blacksburg(.*)$ https://engineroom.raggiesoft.com/stardust-blacksburg permanent;
    rewrite ^/pacific-rim(.*)$ https://engineroom.raggiesoft.com/pacific-rim permanent;
    rewrite ^/engine-room/licensing/?$ https://engineroom.raggiesoft.com/commercial-licensing permanent;
    rewrite ^/engine-room/?$ https://engineroom.raggiesoft.com/ permanent;
    rewrite ^/engine-room/(.+)$ https://engineroom.raggiesoft.com/$1 permanent;


    location ^~ /includes/components/apps/ {
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    location ^~ /includes/ {
        deny all;
        return 404;
    }

    location ~* \.(gif|png|jpe?g|svg|webp|ico)$ {
        valid_referers none blocked server_names
                       *.raggiesoft.com
                       *.michaelpragsdale.com michaelpragsdale.com
                       *.engineroom-records.com engineroom-records.com
                       *.thestardustengine.com thestardustengine.com
                       *.fracturedprisms.com fracturedprisms.com
                       *.aethelsaga.com aethelsaga.com
                       *.raggiesoftknox.com raggiesoftknox.com
                       *.raggiesoftmedia.com raggiesoftmedia.com
                       *.stardustenginecms.com stardustenginecms.com
                       ~\.google\. ~\.bing\. ~\.yahoo\. ~\.duckduckgo\. ~\.yandex\.
                       ~\.ask\. ~\.lycos\. ~\.altavista\.;
        if ($invalid_referer) {
            return 302 https://assets.raggiesoft.com/common/images/no-hotlink.jpg;
        }
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /amanda/elara.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    error_page 403 /amanda/errors/403.php;
    error_page 404 /amanda/errors/404.php;
    error_page 500 /amanda/errors/500.php;
    error_page 502 /amanda/errors/502.php;
    error_page 503 /amanda/errors/503.php;
    error_page 504 /amanda/errors/504.php;

    location ^~ /amanda/errors/ {
        internal;
    }

    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

server {
    if ($host = www.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
        server_name raggiesoft.com www.raggiesoft.com;
    return 404;
}
