# ============================================================================
# Architectural Block: nebulae.raggiesoft.com.conf
# ============================================================================
# Domain: nebulae.raggiesoft.com (The RaggieSoft Nebulae — Master Cosmic Observatory & Complete Network Sitemap)
# Repository: /raggiesoft-nebulae (Local: /raggiesoft.com/subdomains/nebulae)
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/nebulae.raggiesoft.com;
    index index.php index.html;

    server_name nebulae.raggiesoft.com;

    access_log /var/log/nginx/nebulae.raggiesoft_access.log;
    error_log /var/log/nginx/nebulae.raggiesoft_error.log;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string /celeste/lyra.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
    }
}
