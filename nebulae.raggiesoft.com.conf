# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://nebulae.raggiesoft.com`
#   (The RaggieSoft Nebulae — home of the interactive 1996 "Escape Velocity
#   (Ad Astra)" Short Film Storyboard & Caelum-IV Planetary Survey).
#
# Why does it exist in the ecosystem?
#   When a visitor opens `nebulae.raggiesoft.com`, Nginx receives the encrypted
#   HTTPS request first. Because Nginx is a web server and reverse proxy—not a
#   PHP interpreter—this config file tells Nginx where Nebulae's files live
#   (`/var/www/nebulae.raggiesoft.com`) and how to pass `.php` execution over a
#   fast local Unix socket to PHP 8.5 (`php8.5-fpm.sock`), which runs the
#   `subdomains/nebulae/index.php` script we studied earlier!
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for `nebulae.raggiesoft.com`.
#   - Outputs: Redirects HTTP to HTTPS (`301`), blocks hidden dot-files (`403`),
#     strips trailing slashes (`301`), serves existing static files directly, and
#     forwards `/` (plus any unknown paths so PHP can render its branded HTTP `404`
#     state) into `/index.php`.
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`nebulae.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Listen on port 443 (HTTPS) for both IPv4 (`listen 443 ssl`) and IPv6 (`[::]:443 ssl`).
    listen 443 ssl;
    listen [::]:443 ssl;

    # Wildcard SSL Certificate (`*.raggiesoft.com`) and modern TLS 1.2 / 1.3 encryption ciphers.
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Web root directory on the Linux server and default index filename priority (`index.php` first).
    root /var/www/nebulae.raggiesoft.com;
    index index.php index.html;

    # Match requests whose `Host` header is `nebulae.raggiesoft.com`.
    server_name nebulae.raggiesoft.com;

    # Dedicated access and error log files for Nebulae.
    access_log /var/log/nginx/nebulae.raggiesoft_access.log;
    error_log /var/log/nginx/nebulae.raggiesoft_error.log;

    # Block external access (`403 Forbidden`) to hidden files/directories like `.git` or `.env`.
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: strip trailing slashes on non-root paths via `301` redirect.
    rewrite ^/(.+)/$ /$1 permanent;

    # PHP Front-Controller Routing (`location /`):
    # Compare how `try_files` works here vs. static SSG (`engineroom.raggiesoft.com.conf`):
    #   - Static SSG checks `$uri $uri.html $uri/index.html =404` on disk.
    #   - Client SPA checks `$uri /index.html` so browser JS routes the page.
    #   - PHP Front-Controller (HERE): `try_files $uri /index.php?$query_string;`
    #     If a static file exists at `$uri`, Nginx serves it directly; otherwise Nginx
    #     hands the request to `/index.php` (preserving any `?$query_string`), where
    #     PHP inspects `$_SERVER['REQUEST_URI']` and emits `200 OK` for `/` or
    #     `http_response_code(404)` with the branded Nebulae 404 screen!
    location / {
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM FastCGI Bridge (`location ~ \.php$`):
    # Includes Debian/Ubuntu's standard `fastcgi-php.conf` safety snippet (which verifies
    # the `.php` file actually exists before executing) and sends the request over the
    # in-memory Unix domain socket `/var/run/php/php8.5-fpm.sock` to PHP 8.5.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
    }
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS REDIRECT (`http://nebulae.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nebulae.raggiesoft.com;

    if ($host = nebulae.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
