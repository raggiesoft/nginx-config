# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx ("engine-x") Virtual Host configuration for
#   `https://crossroads.raggiesoft.com` (**RaggieSoft Story Crossroads** —
#   RaggieSoft's interactive-fiction imprint home, medallion guide, and live
#   branching-story sandbox built with **Eleventy v3 + Lit 3 + TypeScript**).
#
# Why does it exist in the ecosystem?
#   During `npm run build`, Eleventy v3 compiles every route (`/`,
#   `/how-it-works`, `/seals`, `/catalog`, `/sandbox`, and `/404.html`) into
#   static HTML inside `/dist`, while `esbuild` bundles our Lit 3 Custom Elements
#   into `/dist/assets/crossroads-islands.js`. `sarah-deploy.sh` then syncs and
#   minifies `/dist` into `/var/www/crossroads.raggiesoft.com` so Nginx serves
#   every page directly from disk cache with zero Node.js runtime processes!
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for
#     `crossroads.raggiesoft.com` protected by our `*.raggiesoft.com` wildcard SSL.
#   - Outputs: Redirects HTTP to HTTPS (`301`), normalizes trailing slashes,
#     serves real HTTP `404` status codes via `/404.html` (never soft-404s),
#     caches `sitemap.xml` for 1 hour, and caches static CSS/JS/images for 6 months.
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`crossroads.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS requests addressed to `crossroads.raggiesoft.com`.
    server_name crossroads.raggiesoft.com;

    # Production directory hydrated & minified by `sarah-deploy.sh`.
    root /var/www/crossroads.raggiesoft.com;

    # Dedicated Nginx access and error logs for quick diagnostics.
    access_log /var/log/nginx/crossroads.raggiesoft_access.log;
    error_log /var/log/nginx/crossroads.raggiesoft_error.log;

    # Automatically resolve directory requests (like `/`) to `index.html`.
    index index.html;

    # Security Guardrail: deny public requests to hidden dot-files (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: redirect `/catalog/` -> `/catalog` (`301 Permanent`)
    # so search crawlers index one canonical URL per route.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Error Page (`dist/404.html` marked `noindex,follow`):
    # `internal;` prevents direct `/404.html` requests from pretending to be 200 OK.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached for 1 hour (`3600` seconds).
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Static Eleventy Route Resolution (`try_files` ending in `=404`—zero soft-404s!):
    # Tries exact file (`$uri`), then `<route>.html`, then `<route>/index.html`,
    # and returns a genuine HTTP `404 Not Found` if none exist.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Long-Lived Caching (`6M` = 6 months) for Static Stylesheets, Lit Bundles & Icons:
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Shared Wildcard SSL Certificate (`*.raggiesoft.com`) & Modern TLS 1.2/1.3 Ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS REDIRECT (`http://crossroads.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name crossroads.raggiesoft.com;

    # Upgrade plain HTTP port 80 requests permanently (`301`) to HTTPS port 443
    if ($host = crossroads.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
