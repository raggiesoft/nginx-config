# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://music.raggiesoft.com`
#   (**The Listening Room** — RaggieSoft's interactive music streaming and karaoke-
#   synced `.vtt` lyrics Progressive Web App, built with SvelteKit 2 + Svelte 5 Runes).
#
# Why does it exist in the ecosystem?
#   Every musical release across Engine Room Records, The Stardust Engine, and
#   Fractured Prisms streams here. SvelteKit pre-renders every artist, album, and
#   track page into static HTML + immutable `/_app/` JS/CSS bundles at build time,
#   and `sarah-deploy.sh` syncs that static PWA build into `/var/www/music.raggiesoft.com`.
#   This Nginx config serves those pages at wire speed, redirects legacy `/artists/...`
#   links, keeps `/sw.js` uncached for instant PWA updates, and caches `/_app/`
#   bundles immutably for 1 full year.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for `music.raggiesoft.com`.
#   - Outputs: Redirects legacy `/artists` paths (`301`), strips trailing slashes,
#     serves UTF-8 XML sitemaps, resolves pre-rendered track/album pages (`200 OK`)
#     or `/404.html` (`404 Not Found`), and applies tailored `Cache-Control` lifetimes
#     for Service Workers (`0s`), manifests (`1h`), media (`30d`), and SvelteKit chunks (`1y`).
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# Upstream CDN / DNS: Cloudflare (Proxied A Record with Full/Strict SSL)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`music.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS traffic addressed to `music.raggiesoft.com`.
    server_name music.raggiesoft.com;

    # Directory containing the compiled SvelteKit static PWA output (`build/`).
    root /var/www/music.raggiesoft.com;

    # Access and error logs on disk.
    access_log /var/log/nginx/music.raggiesoft_access.log;
    error_log /var/log/nginx/music.raggiesoft_error.log;

    # Default directory index file.
    index index.html;

    # Deny access (`403 Forbidden`) to hidden dot-files and version-control folders (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # 0. Legacy Deep-Link Redirects (`301 Moved Permanently`):
    # Older links used `/artists` (now `/discography`) and `/artists/the-stardust-engine/...`
    # (now top-level `/the-stardust-engine/...`). Non-greedy `(.+?)` captures the artist/album/track
    # slug without swallowing any optional trailing slash!
    location = /artists {
        return 301 /discography;
    }
    location ^~ /artists/ {
        rewrite ^/artists/?$ /discography permanent;
        rewrite ^/artists/(.+?)/?$ /$1 permanent;
    }

    # 0b. Canonical Trailing-Slash Normalization:
    # Matches SvelteKit's `trailingSlash = 'never'` setting so `/discography/` 301-redirects
    # to `/discography`, matching every page's canonical URL tag.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Page for unknown catalog URLs (`internal;` prevents direct `/404.html` access).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 1a. XML Sitemaps (`/sitemap.xml` and `/sitemaps/...`):
    # Explicitly sets `application/xml; charset=utf-8` so international characters in track
    # titles parse cleanly in search consoles, cached for 1 hour (`3600`s).
    location = /sitemap.xml {
        default_type application/xml;
        charset utf-8;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ^~ /sitemaps/ {
        default_type application/xml;
        charset utf-8;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 1b. Pre-Rendered SvelteKit Static HTML & Catalog Routing (`location /`):
    # Notice how SvelteKit's static adapter combines the best of SSG and SPA:
    #   - Every valid album/song route is pre-rendered to `<route>.html` or `<route>/index.html`
    #     at build time, so `try_files $uri $uri.html $uri/index.html =404;` serves full HTML
    #     immediately on first load (and returns a real `404` for bogus URLs), THEN Svelte 5
    #     hydrates in the browser so clicking between tracks keeps audio playing smoothly
    #     like a Single-Page Application (without needing an unselective `/index.html` fallback
    #     or a PHP front-controller)!
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 2. Progressive Web App Service Worker (`/sw.js`):
    # Strictly never cached (`expires -1`, `no-store, no-cache, must-revalidate, max-age=0`)
    # so installed Listening Room PWAs pick up new catalog releases right away.
    location = /sw.js {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 3. Progressive Web App Manifest (`/manifest.json`):
    # Short 1-hour cache (`3600`s) so app icons and metadata updates roll out quickly.
    location = /manifest.json {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    # 4. SvelteKit Immutable Build Artifacts (`^~ /_app/`):
    # Everything inside `/_app/immutable/...` has a cryptographic content hash in its filename.
    # Caching for 1 full year (`1y` = `31,536,000`s) with `immutable` means repeat visitors
    # load the player UI from local disk in 0ms!
    location ^~ /_app/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 5. General Static Media, Icons & Fonts: cached for 30 days (`2,592,000`s).
    # (Mastered MP3/FLAC audio streams and `.vtt` lyrics load from `assets.raggiesoft.com` CDN.)
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|eot|ttf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ------------------------------------------------------------------------
    # SSL Configuration (Cloudflare Origin CA Wildcard Certificate)
    # ------------------------------------------------------------------------
    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS INSECURE TRAFFIC REDIRECTION (PORT 80 -> PORT 443)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name music.raggiesoft.com;

    if ($host = music.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
