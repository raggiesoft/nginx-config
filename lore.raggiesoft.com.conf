# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://lore.raggiesoft.com`
#   (the RaggieSoft Universal Lore Encyclopedia, built with Next.js 16 + React 19
#   + Tailwind CSS v4 in Static Export mode).
#
# Why does it exist in the ecosystem?
#   Even though Next.js is a React framework, `lore.raggiesoft.com` is compiled
#   at build time with `output: 'export'` into pure static HTML, CSS, and JS
#   files inside `/var/www/lore.raggiesoft.com`—meaning no Node.js server process
#   needs to run in production! Nginx serves every encyclopedia article directly
#   from disk in microseconds.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for `lore.raggiesoft.com`.
#   - Outputs: Redirects HTTP to HTTPS (`301`), strips non-root trailing slashes,
#     serves Next.js static HTML exports (`200 OK`) or Next.js's exported `/404.html`
#     with a genuine `404` status code, caches XML sitemaps for 1 hour, and caches
#     immutable static assets for 6 months (`6M`).
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`lore.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS traffic whose `Host` header is `lore.raggiesoft.com`.
    server_name lore.raggiesoft.com;

    # Filesystem root holding the Next.js static export (`out/` synced by `sarah-deploy.sh`).
    root /var/www/lore.raggiesoft.com;

    # Dedicated access and error log files.
    access_log /var/log/nginx/lore.raggiesoft_access.log;
    error_log /var/log/nginx/lore.raggiesoft_error.log;

    # Default file served when requesting a directory like `/`.
    index index.html;

    # Security Guardrail: block external access to hidden dot-files/folders (`.git`, `.env`, `.next`).
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: strip trailing slashes on non-root URLs via `301` redirect
    # (`/characters/cassidy/` -> `/characters/cassidy`).
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Page exported by Next.js (`src/app/not-found.tsx` -> `/404.html`):
    # `internal;` ensures `/404.html` is only rendered when Nginx triggers a real 404 error.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached for 1 hour (`3600` seconds) for search crawlers.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Core Routing for Next.js Static Export (`location /`):
    # Compare how `try_files` behaves across RaggieSoft's three server patterns:
    #   1. Static SSG Export (HERE): `try_files $uri $uri.html $uri/index.html =404;`
    #      Checks exact file (`$uri`), then `<slug>.html` (Next.js static page export),
    #      then `<slug>/index.html`, and returns a genuine `=404` if not found!
    #   2. Client-Only SPA Fallback: `try_files $uri /index.html (without =404)` (serves the app shell
    #      for unknown paths when routes only exist in browser JS).
    #   3. PHP Front-Controller (`books`, `raggiesoft.com`): `try_files $uri /router.php?$query_string;`
    #      forwards dynamic URLs to PHP-FPM over a Unix socket.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Aggressive Caching for Static Assets (`6M` = 6 months = `15,552,000` seconds):
    # Next.js fingerprints its compiled `_next/static/...` CSS and JS filenames with
    # content hashes (e.g., `page-a1b2c3d4.js`). Whenever code changes, the filename
    # itself changes, making `immutable` caching completely safe and instant on repeat visits!
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443) for Cloudflare Origin Proxy traffic
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # Wildcard SSL Certificate (`*.raggiesoft.com`) & TLS 1.2 / 1.3 Cipher Suite
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS REDIRECT (`http://lore.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lore.raggiesoft.com;

    # Permanently redirect insecure HTTP requests on port 80 to encrypted HTTPS on port 443
    if ($host = lore.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
