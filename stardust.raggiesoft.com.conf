# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://stardust.raggiesoft.com`
#   (The Stardust Engine Official Band, Cosmic Lore & Fleet Portal, built with
#   Nuxt 4 + Vue 3 Static Site Generation / SSG).
#
# Why does it exist in the ecosystem?
#   Nuxt 4 pre-renders every band biography, timeline era, discography release,
#   and starship lore page into static HTML files inside `/var/www/stardust.raggiesoft.com`.
#   This file configures Nginx to serve those static pages directly from disk,
#   normalize legacy `/records/stardust-engine` links, and permanently redirect
#   the standalone band vanity domain `thestardustengine.com` into
#   `https://stardust.raggiesoft.com` under RaggieSoft's Subdomain-First Architecture.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for
#     `stardust.raggiesoft.com` and `thestardustengine.com`.
#   - Outputs: Enforces HTTPS (`301`), strips non-root trailing slashes, maps
#     clean URLs to pre-rendered Nuxt HTML (`200 OK`) or `/404.html` (`404 Not Found`),
#     caches static assets for 7 days and XML sitemaps for 1 hour, and redirects
#     `thestardustengine.com` preserving the full `$request_uri`.
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`stardust.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS requests for `stardust.raggiesoft.com`.
    server_name stardust.raggiesoft.com;

    # Linux directory containing Nuxt 4's static generation output (`.output/public/`).
    root /var/www/stardust.raggiesoft.com;

    # Dedicated access and error log files.
    access_log /var/log/nginx/stardust.raggiesoft_access.log;
    error_log /var/log/nginx/stardust.raggiesoft_error.log;

    # Default file served for directory roots (`/`).
    index index.html;

    # Block external access (`403 Forbidden`) to hidden dot-files (`.git`, `.env`, `.nuxt`).
    location ~ /\. {
        deny all;
    }

    # Legacy Path Normalization Redirects (`permanent` = HTTP 301):
    # Redirects older `/records/stardust-engine/...` URLs cleanly into `/discography/...`.
    rewrite ^/records/stardust-engine/?$ /discography permanent;
    rewrite ^/records/stardust-engine/(.+)$ /discography/$1 permanent;

    # Canonical URL Normalization: strip trailing slashes on non-root paths via `301`.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Error Page (`internal;` blocks direct `/404.html` visits).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached for 1 hour (`3600`s) for search crawlers.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Nuxt 4 Static SSG Route Resolution (`location /`):
    # Compare how Nginx resolves routes across SSG vs. SPA vs. PHP:
    #   - Static SSG (HERE): `try_files $uri $uri.html $uri/index.html =404;`
    #     Serves Nuxt's pre-rendered HTML straight from disk and returns a genuine `404`
    #     for non-existent routes (zero soft-404s!), then Vue 3 hydrates in the browser.
    #   - Client-Only Vue SPA: `try_files $uri /index.html (without =404)` (serves an empty HTML shell
    #     and waits for JS to render—slower first paint and weaker SEO).
    #   - PHP Front-Controller: `try_files $uri /router.php?$query_string;` (server-rendered PHP).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Static Assets (icons, starship artwork, fonts, CSS, JS, JSON payloads): cached 7 days (`604800`s).
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js|json)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Wildcard SSL Certificate (`*.raggiesoft.com`) & TLS 1.2 / 1.3 Ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. VANITY DOMAIN 301 REDIRECT (`thestardustengine.com` -> `stardust.raggiesoft.com`)
# ----------------------------------------------------------------------------
# Why does `thestardustengine.com` redirect to `stardust.raggiesoft.com` via `301`?
#   In RaggieSoft's Subdomain-First Architecture, `thestardustengine.com` acts as a
#   memorable vanity address on album sleeves and liner notes, while `return 301`
#   immediately funnels every visitor and search crawler onto `stardust.raggiesoft.com`
#   (preserving `$request_uri` such as `/discography`), avoiding duplicate-content splits
#   and keeping the visitor seamlessly connected to `music.raggiesoft.com` and `books.raggiesoft.com`!
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thestardustengine.com www.thestardustengine.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://stardust.raggiesoft.com$request_uri;
}

# ----------------------------------------------------------------------------
# 3. HTTP-TO-HTTPS REDIRECT (`http://stardust.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stardust.raggiesoft.com;

    if ($host = stardust.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
