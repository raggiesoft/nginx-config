# ============================================================================
# Architectural Block: stardust.raggiesoft.com.conf
# ============================================================================
# Domain: stardust.raggiesoft.com (The Stardust Engine Cosmic Lore & Fleet Portal)
# Repository: /raggiesoft-stardust-engine (Local: /raggiesoft.com/subdomains/stardust)
# Platform: Nuxt 4 + Vue 3 Static Site Generation (SSG)
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
#
# Vanity Domain 301 Redirect:
# - thestardustengine.com -> https://stardust.raggiesoft.com$request_uri
# ============================================================================

server {
    server_name stardust.raggiesoft.com;
    root /var/www/stardust.raggiesoft.com;

    access_log /var/log/nginx/stardust.raggiesoft_access.log;
    error_log /var/log/nginx/stardust.raggiesoft_error.log;

    index index.html;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js|json)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# Vanity Domain 301 Redirect: thestardustengine.com -> stardust.raggiesoft.com
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thestardustengine.com www.thestardustengine.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://stardust.raggiesoft.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name stardust.raggiesoft.com;

    if ($host = stardust.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

