# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx ("engine-x") Virtual Host configuration for
#   `https://a11y.raggiesoft.com` (**RaggieSoft Accessibility Studio**: the
#   commercial B2B enterprise product & documentation portal for our Windows
#   workstation WCAG 2.2 AA & Revised Section 508 Web Engineering IDE and CLI,
#   built with **IBM Carbon Design System (`@carbon/web-components` +
#   `@carbon/styles`) + TypeScript + Vite Static SSG**).
#
# Why does it exist in the ecosystem?
#   During `npm run build`, Vite and `scripts/prerender.mjs` compile and
#   pre-render every canonical route (`/`, `/features`, `/enterprise`,
#   `/reports`, `/docs`, and `/404.html`) into static HTML, CSS, and hashed ES
#   module bundles inside `/dist`, which `sarah-deploy.sh` syncs and minifies
#   into `/var/www/a11y.raggiesoft.com`. Zero Node.js server processes run in
#   production—Nginx serves static HTML straight from Linux memory cache!
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: HTTP (port 80) and HTTPS (port 443) requests for
#     `a11y.raggiesoft.com` routed through Cloudflare's orange-cloud proxy.
#   - Outputs: Redirects HTTP to HTTPS (`301`), normalizes trailing slashes,
#     serves genuine HTTP `404` responses via `/404.html` (zero soft-404s!),
#     caches XML sitemaps for 1 hour, and caches hashed Vite `/assets/*` bundles
#     for 6 months (`immutable`).
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`a11y.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS traffic whose `Host` header is `a11y.raggiesoft.com`.
    server_name a11y.raggiesoft.com;

    # Linux showroom directory populated & minified by `sarah-deploy.sh`.
    root /var/www/a11y.raggiesoft.com;

    # Dedicated Nginx access and error logs for diagnostics.
    access_log /var/log/nginx/a11y.raggiesoft_access.log;
    error_log /var/log/nginx/a11y.raggiesoft_error.log;

    # Serve `index.html` automatically when visiting directory paths like `/`.
    index index.html;

    # Security Guardrail: block external access to any hidden dot-file (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: redirect `/features/` -> `/features` (`301 Permanent`)
    # so search engines index one canonical URL per route.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Error Page (`dist/404.html` marked `noindex,follow`):
    # `internal;` ensures `/404.html` is served only on real 404 misses.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached for 1 hour (`3600` seconds) for crawlers.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Static SSG Route Resolution (`try_files` ending in `=404`—zero soft-404s!):
    # Checks exact file (`$uri`), then `<route>.html`, then `<route>/index.html`,
    # and returns a true HTTP `404 Not Found` if none match.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Long-Lived Immutable Caching (`6M` = 6 months) for Content-Hashed Vite Assets:
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Shared Wildcard SSL Certificate (`*.raggiesoft.com`) & Modern TLS 1.2/1.3 Ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS REDIRECT (`http://a11y.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name a11y.raggiesoft.com;

    # Redirect plain HTTP requests on port 80 permanently to HTTPS on port 443
    if ($host = a11y.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
