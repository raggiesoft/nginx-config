# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the permanent HTTP `301 Moved Permanently` Nginx Virtual Host for
#   `a11y.raggiesoft.com`, redirecting all legacy root and deep-link requests
#   in a single hop onto **`https://raggiesoftstudio.com/accessibility-studio`**!
#
# Why did we consolidate `a11y.raggiesoft.com` into `raggiesoftstudio.com`?
#   **RaggieSoft Studio** (`https://raggiesoftstudio.com`) is the unified home
#   for all RaggieSoft developer, packaging, and compliance workstations
#   (**Installer Studio**, **Accessibility Studio**, **Launcher Studio**, and
#   **Showcase Studio**). Mounting the IBM Carbon Design System + Lit 3 SSG
#   directly at `https://raggiesoftstudio.com/accessibility-studio` keeps all
#   Studio developer tools under one cohesive domain while preserving 100% of
#   previously distributed resume, GitHub, and SARIF `informationUri` deep links!
#
# Why split `location = /` vs. `location /`?
#   `raggiesoftstudio.com` normalizes trailing slashes via `rewrite ^/(.+)/$ /$1 permanent;`.
#   - Mapping exact `/` (`location = /`) directly to
#     `https://raggiesoftstudio.com/accessibility-studio$is_args$args` (no trailing `/`)
#     lands on the canonical URL in **1 single HTTP 301 hop** (zero redirect chains!).
#   - Mapping sub-paths (`location /`, e.g. `/enterprise` or `/reports`) to
#     `https://raggiesoftstudio.com/accessibility-studio$request_uri` preserves
#     every deep link (`/enterprise` -> `.../accessibility-studio/enterprise`)!
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. HTTPS 1-HOP PERMANENT 301 REDIRECT (`https://a11y.raggiesoft.com` -> Studio)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name a11y.raggiesoft.com;

    access_log /var/log/nginx/a11y.raggiesoft_access.log;
    error_log /var/log/nginx/a11y.raggiesoft_error.log;

    # Shared Wildcard SSL Certificate (`*.raggiesoft.com`) & Modern TLS 1.2/1.3 Ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Exact root `/` -> canonical `/accessibility-studio` (no trailing slash = 1 hop!)
    location = / {
        return 301 https://raggiesoftstudio.com/accessibility-studio$is_args$args;
    }

    # Deep links (`/features`, `/enterprise`, `/reports`, `/docs`) -> `/accessibility-studio/...`
    location / {
        return 301 https://raggiesoftstudio.com/accessibility-studio$request_uri;
    }
}

# ----------------------------------------------------------------------------
# 2. HTTP 1-HOP PERMANENT 301 REDIRECT (`http://a11y.raggiesoft.com` -> Studio)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name a11y.raggiesoft.com;

    location = / {
        return 301 https://raggiesoftstudio.com/accessibility-studio$is_args$args;
    }

    location / {
        return 301 https://raggiesoftstudio.com/accessibility-studio$request_uri;
    }
}
