# ============================================================================
# Architectural Block: books.raggiesoft.com.conf
# ============================================================================
# Domain: books.raggiesoft.com (RaggieSoft Book Reader / Ocean View Archives)
# Platform: PHP 8.5-FPM + Stardust Engine Library Progressive Web App (PWA)
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# Upstream CDN / DNS: Cloudflare (Proxied A Record with Full/Strict SSL)
#
# Key Architectural Responsibilities:
# 1. OVA Siblings Front-Controller Routing:
#    - Routes dynamic URI paths through `/eleanor/isabel.php` while denying
#      direct external access to `/sophia/` and `/includes/`.
# 2. PWA Lifecycle Optimization:
#    - `/sw.js` (Service Worker): Strictly served with `no-store, no-cache, must-revalidate`
#      so Cloudflare and Safari/Chromium PWAs never cache stale Service Worker scripts.
#    - `/manifest.json`: Served with a short 1-hour TTL for rapid icon/metadata updates.
# ============================================================================

server {
    server_name books.raggiesoft.com;
    root /var/www/raggiesoft-book-library;

    access_log /var/log/nginx/books.raggiesoft_access.log;
    error_log /var/log/nginx/books.raggiesoft_error.log;

    # Security through obscurity protocol:
    # Public directory: eleanor
    # PHP Router file: isabel.php
    index eleanor/isabel.php;

    location ~ /\. {
        deny all;
    }

    # Block direct external requests to internal PHP templates and route manifests
    location ^~ /sophia/ {
        deny all;
    }
    location ^~ /includes/ {
        deny all;
    }

    # Progressive Web App: Service Worker (Never cache at browser or Cloudflare edge)
    location = /sw.js {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Progressive Web App: Web App Manifest
    location = /manifest.json {
        default_type application/manifest+json;
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Serve crawler discovery & XML sitemap files directly with clean headers
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /726167676965736f6674696e6465786e.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ^~ /sitemaps/ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Canonical URL normalization: permanently strip trailing slashes on non-root URLs
    rewrite ^/(.+)/$ /$1 permanent;

    # Route everything through the master router (Isabel)
    location / {
        try_files $uri /eleanor/isabel.php?$query_string;
    }

    # Pass PHP scripts to FastCGI
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Catch the Cloudflare HTTPS proxy traffic
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # The wildcard SSL certificates
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# Vanity Domain 301 Redirect: aethelsaga.com -> books.raggiesoft.com/aethel
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aethelsaga.com www.aethelsaga.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://books.raggiesoft.com/aethel;
}

server {
    listen 80;
    listen [::]:80;
    server_name books.raggiesoft.com;

    if ($host = books.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
