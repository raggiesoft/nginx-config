# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://books.raggiesoft.com`
#   (RaggieSoft Book Reader / Ocean View Archives & RaggieSoft Story Crossroads).
#   Unlike static-HTML sites where every URL is an `.html` file on disk, Book
#   Reader is a dynamic PHP 8.5 + Progressive Web App (PWA) library powered by
#   a single PHP "front controller" (`eleanor/isabel.php`).
#
# Why does it exist in the ecosystem?
#   Hundreds of book, episode, chapter, and interactive Crossroads URLs (like
#   `/katie/e005/c002/p003` or `/ad-astra`) need clean, human-readable paths
#   without `.php` extensions, while keeping internal PHP template folders
#   (`/sophia/` and `/includes/`) completely locked away from direct public downloads.
#   This file also redirects the standalone vanity domain `aethelsaga.com` into
#   `https://books.raggiesoft.com/aethel`.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: Browser and crawler requests on ports 80 and 443 for
#     `books.raggiesoft.com` and `aethelsaga.com`.
#   - Outputs: Serves static assets, sitemaps, and PWA files directly from
#     `/var/www/raggiesoft-book-library` at C-speed, blocks secret directories
#     with `403 Forbidden`, and forwards all novel/library routes over a local
#     Unix socket (`php8.5-fpm.sock`) to PHP 8.5 (`eleanor/isabel.php`).
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`books.raggiesoft.com` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match incoming HTTPS requests whose `Host` header is `books.raggiesoft.com`.
    server_name books.raggiesoft.com;

    # Base filesystem folder where the Book Reader application lives on the Droplet.
    root /var/www/raggiesoft-book-library;

    # Separate access and error logs for quick troubleshooting on the Linux server.
    access_log /var/log/nginx/books.raggiesoft_access.log;
    error_log /var/log/nginx/books.raggiesoft_error.log;

    # Default directory index file: OVA Siblings naming protocol uses `/eleanor/`
    # as the public router folder and `isabel.php` as the master PHP router script!
    index eleanor/isabel.php;

    # Block any hidden dot-files or dot-folders (`.git`, `.env`, `.DS_Store`).
    location ~ /\. {
        deny all;
    }

    # Protect Internal Server Folders (`^~` prefix match stops regex evaluation early):
    # PHP's `require` inside `isabel.php` reads `/sophia/` and `/includes/` directly
    # from the Linux filesystem, so external web browsers NEVER need direct HTTP access
    # to these folders. `deny all;` returns `403 Forbidden` to outside probes.
    location ^~ /sophia/ {
        deny all;
    }
    location ^~ /includes/ {
        deny all;
    }

    # Progressive Web App Service Worker (`/sw.js`):
    # Never cache at the browser or Cloudflare edge (`expires -1`, `no-store, no-cache`)
    # so readers always get new offline-reading features as soon as they deploy.
    location = /sw.js {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Progressive Web App Manifest (`/manifest.json`):
    # Declares app icons, theme colors, and standalone window behavior when a reader
    # installs Book Reader to their phone/desktop home screen. Cached briefly (1 hour).
    location = /manifest.json {
        default_type application/manifest+json;
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Search Crawler Rules (`/robots.txt`) & IndexNow Key File:
    # Served directly from disk with explicit `text/plain` MIME headers and a 1-hour cache,
    # bypassing PHP completely for zero CPU overhead when search bots crawl the site.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /726167676965736f6674696e6465786e.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # XML Sitemap Index (`/sitemap.xml`) and Per-Book Sitemaps (`/sitemaps/...`):
    # Served directly as `application/xml` with a 1-hour cache (`max-age=3600`).
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ^~ /sitemaps/ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Canonical URL Normalization: strip trailing slashes on non-root URLs via `301` redirect
    # (for example, `/ad-astra/` permanently redirects to `/ad-astra`).
    rewrite ^/(.+)/$ /$1 permanent;

    # Master PHP Front-Controller Routing (`location /`):
    # Compare how `try_files` works here vs. static SSG or client-side SPAs:
    #   - Static SSG (`engineroom`, `stardust`): `try_files $uri $uri.html $uri/index.html =404;`
    #   - Client SPA: `try_files $uri /index.html (without =404)` (browser JS parses the URL)
    #   - PHP Front-Controller (HERE): `try_files $uri /eleanor/isabel.php?$query_string;`
    #     First, Nginx checks if an exact static file (`$uri`, like `/favicon.ico`) exists on disk.
    #     If not, Nginx internally forwards the request (plus any `?q=...` `$query_string`)
    #     to `/eleanor/isabel.php`, which looks up the book/chapter in PHP and renders HTML
    #     (or emits a genuine HTTP `404` if the chapter doesn't exist)!
    location / {
        try_files $uri /eleanor/isabel.php?$query_string;
    }

    # PHP-FPM Execution Bridge (`location ~ \.php$` matches any `.php` script):
    # Nginx itself does NOT execute PHP code—instead, it speaks the FastCGI binary
    # protocol to `php8.5-fpm` (PHP FastCGI Process Manager) over a local Unix domain
    # socket file (`unix:/var/run/php/php8.5-fpm.sock`). Using a Unix socket file in RAM
    # instead of `127.0.0.1:9000` avoids TCP/IP network stack overhead and cannot be
    # reached from outside the server!
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443) for Cloudflare Full/Strict SSL proxy traffic
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # Wildcard SSL Certificate (`*.raggiesoft.com`) and modern TLS 1.2/1.3 ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. VANITY DOMAIN 301 REDIRECT (`aethelsaga.com` -> `books.raggiesoft.com/aethel`)
# ----------------------------------------------------------------------------
# Why redirect standalone domains like `aethelsaga.com` to `*.raggiesoft.com` subdomains?
#   RaggieSoft uses a unified Subdomain-First Architecture: hosting all books under
#   `books.raggiesoft.com` lets readers share one PWA installation, one reading-progress
#   storage origin, and consolidated domain SEO authority, while `return 301` ensures
#   anyone typing `aethelsaga.com` on HTTP (80) or HTTPS (443) lands right on `/aethel`.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aethelsaga.com www.aethelsaga.com;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;

    return 301 https://books.raggiesoft.com/aethel;
}

# ----------------------------------------------------------------------------
# 3. HTTP-TO-HTTPS REDIRECT (`http://books.raggiesoft.com` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name books.raggiesoft.com;

    if ($host = books.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
