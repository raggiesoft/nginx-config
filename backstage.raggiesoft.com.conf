# ============================================================================
# Architectural Block: backstage.raggiesoft.com.conf
# ============================================================================
# Domain: backstage.raggiesoft.com (RaggieSoft Backstage — Bonus Features & Archive PWA)
# Repository: /raggiesoft-backstage (Local: /raggiesoft.com/subdomains/backstage)
# Platform: Web Awesome Pro + Font Awesome Pro+ Static SSG & JSON API (/api/v1/)
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

server {
    server_name backstage.raggiesoft.com;
    root /var/www/backstage.raggiesoft.com;

    access_log /var/log/nginx/backstage.raggiesoft_access.log;
    error_log /var/log/nginx/backstage.raggiesoft_error.log;

    index index.html;

    location ~ /\. {
        deny all;
    }

    # Cross-Origin JSON API for RaggieSoft Book Reader (<dialog> modal integration)
    location ^~ /api/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    listen 443 ssl;
    listen [::]:443 ssl;

    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

server {
    listen 80;
    listen [::]:80;
    server_name backstage.raggiesoft.com;

    if ($host = backstage.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}

