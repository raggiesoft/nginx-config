# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is an Nginx ("engine-x") Virtual Host configuration file for
#   `https://backstage.raggiesoft.com` (RaggieSoft Backstage — Bonus Features
#   & Archive Progressive Web App). If you have only written front-end HTML/JS
#   before, think of Nginx as the ultra-fast front-desk traffic controller on
#   our Linux server (`142.93.244.239`). One single server hosts ALL RaggieSoft
#   websites at the same IP address; Nginx inspects the `Host` header of every
#   incoming browser request (e.g., `backstage.raggiesoft.com`) and uses this
#   file to decide which folder of files to serve, which URLs to redirect, and
#   how long browsers may cache images, scripts, and JSON responses.
#
# Why does it exist in the ecosystem?
#   Backstage is a pre-built Static Site Generation (SSG) Progressive Web App
#   powered by Web Awesome Pro + Font Awesome Pro+, plus a read-only JSON API
#   (`/api/...`) fetched cross-origin by `books.raggiesoft.com` to display
#   bonus "What-If" dossiers inside `<dialog>` modals.
#
# What inputs feed into it, and what server behavior does it produce?
#   - Inputs: Incoming HTTP (port 80) and HTTPS (port 443) requests from
#     visitors and Cloudflare's edge proxy, mapped against static HTML/JSON
#     files stored in `/var/www/backstage.raggiesoft.com`.
#   - Outputs: Forces HTTPS encryption (`301` redirect), strips duplicate
#     trailing slashes, redirects renamed Katie "What-If" URLs, serves a real
#     HTTP `404` page for missing routes, disables caching on `/sw.js` so PWA
#     updates take effect immediately, and attaches Cross-Origin Resource
#     Sharing (`CORS`) headers onto `/api/` endpoints.
# ============================================================================

# ----------------------------------------------------------------------------
# PRIMARY HTTPS VIRTUAL HOST (`server { ... }` BLOCK FOR PORT 443)
# ----------------------------------------------------------------------------
# Every `server { ... }` block defines one "virtual server" inside Nginx.
# Notice every simple statement ends with a semicolon `;` (just like JS), and
# nested sections use curly braces `{ ... }`.
server {
    # `server_name` tells Nginx: "Use this `server` block whenever the browser's
    # `Host` header matches `backstage.raggiesoft.com`."
    server_name backstage.raggiesoft.com;

    # `root` sets the Linux folder on disk that corresponds to `/` in the URL.
    # For example, a request for `https://backstage.raggiesoft.com/about.html`
    # looks for `/var/www/backstage.raggiesoft.com/about.html`.
    root /var/www/backstage.raggiesoft.com;

    # Dedicated log files for debugging traffic (`access_log`) and server issues (`error_log`).
    access_log /var/log/nginx/backstage.raggiesoft_access.log;
    error_log /var/log/nginx/backstage.raggiesoft_error.log;

    # `index` sets the default file to serve when someone visits a directory URL like `/`.
    index index.html;

    # Security Guardrail: `location ~ /\.` uses a case-sensitive regular expression (`~`)
    # matching any path segment starting with a dot (like `/.git`, `/.env`, or `/.htaccess`).
    # `deny all;` immediately returns `403 Forbidden` so hidden files can never leak.
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: `rewrite` uses a regex (`^/(.+)/$`) to catch any
    # non-root URL ending in a trailing slash (like `/dossiers/`) and issues an HTTP `301`
    # (`permanent`) redirect to `/dossiers`. Keeping one canonical URL per page prevents
    # search engines from splitting SEO ranking between `/page` and `/page/`.
    rewrite ^/(.+)/$ /$1 permanent;

    # Exact-Match (`=`) Permanent 301 Redirects for re-lettered Katie RRC unlocked-closet
    # "What-If" dossiers (chronological order: A=1:35 AM, B=3:50 AM, C=6:40 AM).
    # `return 301` tells browsers and search engines: "This URL moved permanently;
    # update your bookmarks and search index to the new URL."
    location = /books/katie/what-if-rrc-unlocked-closet-ending-c-wesley-breaks-the-door {
        return 301 /books/katie/what-if-rrc-unlocked-closet-ending-a-wesley-breaks-the-door;
    }
    location = /books/katie/what-if-rrc-unlocked-closet-ending-a-three-fifty-am {
        return 301 /books/katie/what-if-rrc-unlocked-closet-ending-b-three-fifty-am;
    }
    location = /books/katie/what-if-rrc-unlocked-closet-ending-b-six-forty-am-stealth {
        return 301 /books/katie/what-if-rrc-unlocked-closet-ending-c-six-forty-am-stealth;
    }

    # Custom HTTP 404 Error Page:
    # - `error_page 404 /404.html;` tells Nginx to display our branded `/404.html`
    #   file whenever a route returns a genuine HTTP `404 Not Found` status code.
    # - `internal;` prevents visitors from typing `/404.html` directly as a `200 OK` page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Progressive Web App Service Worker (`/sw.js`):
    # Service Workers sit between the browser and the network to power offline mode.
    # If a browser cached `/sw.js` for 7 days, users wouldn't receive site updates!
    # `expires -1;` and `no-store, no-cache, must-revalidate, max-age=0` force
    # browsers and Cloudflare to check for a fresh Service Worker on every check.
    location = /sw.js {
        expires -1;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # XML Sitemaps & Feeds (`~*` = case-insensitive regex matching `.xml` at the end `$`):
    # Cached for 1 hour (`1h` / `3600` seconds), returning `404` if the file doesn't exist.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Cross-Origin JSON API (`^~` = high-priority prefix match for `/api/...`):
    # By default, browser Same-Origin Policy blocks `books.raggiesoft.com` JavaScript
    # from `fetch()`-ing JSON hosted on `backstage.raggiesoft.com`. Adding these
    # `Access-Control-Allow-*` CORS headers (`always`, even on errors) explicitly
    # authorizes cross-subdomain `GET` requests while caching responses for 5 minutes (`300`s).
    location ^~ /api/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ =404;
    }

    # Primary Route Resolution (`location /` catches all paths not matched above):
    # How `try_files` works across the three web architectures in RaggieSoft:
    #   1. Static SSG (THIS FILE): `try_files $uri $uri.html $uri/index.html =404;`
    #      Checks for an exact file (`$uri`), then `<path>.html`, then `<path>/index.html`,
    #      and finally returns a real HTTP `=404` if none exist on disk!
    #   2. Client-Only SPA Fallback: `try_files $uri $uri/ /index.html (without =404)` (hands unknown
    #      paths to JS router, though pre-rendered SSG + `=404` is preferred for SEO).
    #   3. PHP Front-Controller (see `books` / `raggiesoft.com`): `try_files $uri /router.php?$query_string;`
    #      hands dynamic URLs to a PHP script on the server.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Static Assets (icons, images, fonts, CSS, JS):
    # Cached in the visitor's browser and CDN for 7 days (`7d` = `604800` seconds),
    # with `access_log off;` to keep disk logs clean and fast.
    location ~* \.(?:ico|svg|png|jpg|jpeg|webp|gif|woff2?|css|js)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTTPS Listener & TLS Encryption:
    # - `listen 443 ssl;` listens on IPv4 port 443 (standard HTTPS port).
    # - `listen [::]:443 ssl;` listens on IPv6 port 443 (`[::]` is IPv6's wildcard address).
    #   (Cloudflare's edge speaks HTTP/2 & HTTP/3 to browsers and proxies over TLS 1.2/1.3 here.)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Wildcard Origin SSL Certificate (`*.raggiesoft.com`) & Modern Cipher Hardening
    # (`!aNULL:!MD5` disables unauthenticated and broken legacy MD5 encryption).
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# HTTP-TO-HTTPS REDIRECT SERVER BLOCK (PORT 80 -> PORT 443)
# ----------------------------------------------------------------------------
# Port 80 is old unencrypted `http://`. If anyone types `http://backstage.raggiesoft.com/foo`,
# this block catches it and immediately returns a `301` permanent redirect to
# `https://backstage.raggiesoft.com/foo` (`$host` = domain, `$request_uri` = `/foo?...`).
server {
    listen 80;
    listen [::]:80;
    server_name backstage.raggiesoft.com;

    if ($host = backstage.raggiesoft.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
