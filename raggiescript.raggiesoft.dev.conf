# ============================================================================
# PLAIN-ENGLISH OVERVIEW FOR NEW DEVELOPERS (READ-ALONG TEACHING HEADER)
# ============================================================================
# What is this file?
#   This is the Nginx Virtual Host configuration for `https://raggiescript.raggiesoft.dev`
#   (**RaggieScript v1.0 Complete Language & Standard Library Documentation Portal**),
#   dogfooded and compiled directly from `desktop-apps/raggiescript/help/source/raggiescript-docs.rshp`
#   by **RaggieSoft Help Studio v0.6.0 (`rshbuild.exe`)**!
#
# Why does it exist in the ecosystem?
#   1. Serves the standalone 3-column `learn.microsoft.com`-grade reference site for
#      RaggieScript (`.rssc`)—every namespace, every function call, every property,
#      every `RSW700`–`RSW715` diagnostic, `/api-index`, `/llms.txt`, `/llms-full.txt`,
#      `/sitemap.xml`, and `/vpat-2.5.html`—at its own canonical subdomain under
#      `raggiesoft.dev` (MIT License for code; CC BY-SA 4.0 for documentation).
#   2. `sync_nginx_vhosts` in `sarah-deploy.sh` automatically creates
#      `/var/www/raggiescript.raggiesoft.dev`, and `deploy_companion_webroot` syncs
#      and minifies `/home/michael/raggiesoft-dev/build/raggiescript/` on every deploy!
#
# Server Infrastructure: DigitalOcean Droplet (NYC1 - 142.93.244.239)
# ============================================================================

# ----------------------------------------------------------------------------
# 1. PRIMARY HTTPS VIRTUAL HOST (`raggiescript.raggiesoft.dev` ON PORT 443)
# ----------------------------------------------------------------------------
server {
    # Match HTTPS traffic for the canonical RaggieScript documentation subdomain.
    server_name raggiescript.raggiesoft.dev;

    # Linux static showroom directory populated & minified by `sarah-deploy.sh`.
    root /var/www/raggiescript.raggiesoft.dev;

    # Dedicated Nginx access and error logs for easy diagnostics.
    access_log /var/log/nginx/raggiescript_raggiesoft_dev_access.log;
    error_log /var/log/nginx/raggiescript_raggiesoft_dev_error.log;

    # Default directory index document and UTF-8 charset for `.txt`, `.json`, & HTML5.
    index index.html;
    charset utf-8;

    # Block external access (`403 Forbidden`) to hidden dot-files (`.git`, `.env`).
    location ~ /\. {
        deny all;
    }

    # Canonical URL Normalization: strip trailing slashes on non-root paths via `301`.
    rewrite ^/(.+)/$ /$1 permanent;

    # Genuine HTTP 404 Error Page (`404.html` emitted by `rshbuild.exe` with `noindex,follow`).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # XML Sitemaps (`sitemap.xml`): cached 1 hour (`3600`s) for search crawlers.
    location ~* \.xml$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # JSON Search Index (`search-index.json`): cached 1 hour so `Ctrl+K` stays fresh.
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Markdown Specs (`*.md`): served inline as UTF-8 Markdown rather than octet-stream.
    location ~* \.md$ {
        default_type "text/markdown; charset=utf-8";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Clean URL & `.html` Route Resolution (`try_files` ending in `=404` — zero soft-404s!).
    # Supports `/ns-sys`, `/ns-sys.html`, and `/ns-sys/index.html` seamlessly.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Static Portal Styles, Scripts & Icons (`1d` public cache with revalidation).
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 1d;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # HTTPS Listeners (IPv4 and IPv6 port 443)
    listen 443 ssl;
    listen [::]:443 ssl;

    # Origin Wildcard SSL Certificate (`*.raggiesoft.dev`) & Modern TLS 1.2 / 1.3 Ciphers
    ssl_certificate /etc/nginx/ssl/raggiesoft.pem;
    ssl_certificate_key /etc/nginx/ssl/raggiesoft.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
}

# ----------------------------------------------------------------------------
# 2. HTTP-TO-HTTPS REDIRECT (`http://raggiescript.raggiesoft.dev` -> `https://...`)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name raggiescript.raggiesoft.dev;

    return 301 https://raggiescript.raggiesoft.dev$request_uri;
}
